function refreshAfterManualEdit() {
  const ls = state.lastSchedule;
  if (!ls) return;
  const { employees } = state;
  const { openDays, schedule, quota, requiredOff } = ls;

  ls.actualWolne = {};
  ls.actualUrlop = {};
  for (const e of employees) {
    ls.actualWolne[e.id] = openDays.filter(d => schedule[d.ds]?.[e.id] === 'Wolne').length;
    ls.actualUrlop[e.id] = openDays.filter(d => schedule[d.ds]?.[e.id] === 'Urlop').length;
  }
  ls.roleCounts = computeRoleCounts(employees, openDays, schedule);
  ls.freeSaturdays = computeFreeSaturdays(employees, openDays, schedule);
  const { hard, soft } = buildScheduleWarnings(
    openDays, schedule, employees, state.curMonth, ls.actualUrlop, ls.freeSaturdays
  );
  ls.warnings = hard;
  ls.softWarnings = soft;

  renderWarnings(ls.warnings, ls.softWarnings);
  renderOutput(
    openDays, schedule, requiredOff,
    ls.actualWolne, ls.actualUrlop, ls.roleCounts, ls.freeSaturdays
  );
  saveCurrentSchedule();
  updateLockToggleButton();
}

function onCellEdit(ds, empId, value) {
  if (!state.lastSchedule?.schedule?.[ds]) return;
  const prev = state.lastSchedule.schedule[ds][empId];
  const wasLocked = isCellLocked(ds, empId);
  if (prev === value && wasLocked) return;
  pushScheduleHistory();
  state.lastSchedule.schedule[ds][empId] = value;
  // Ręczna edycja → automatyczna blokada (nie nadpisze GENERUJ)
  setCellLocked(ds, empId, true);
  refreshAfterManualEdit();
}

function toggleCellLock(ds, empId) {
  if (!state.lastSchedule?.schedule?.[ds]) return;
  setCellLocked(ds, empId, !isCellLocked(ds, empId));
  refreshAfterManualEdit();
}

const XL_BORDER = {
  top: { style: 'thin', color: { rgb: 'D4D4DA' } },
  bottom: { style: 'thin', color: { rgb: 'D4D4DA' } },
  left: { style: 'thin', color: { rgb: 'D4D4DA' } },
  right: { style: 'thin', color: { rgb: 'D4D4DA' } },
};
function xlCell(font, fill, align = 'center') {
  const s = { font, alignment: { horizontal: align, vertical: 'center' }, border: XL_BORDER };
  if (fill) s.fill = { fgColor: { rgb: fill } };
  return s;
}
const XL = {
  title: xlCell({ bold: true, sz: 14, color: { rgb: '220040' } }, null, 'left'),
  header: xlCell({ bold: true, sz: 11, color: { rgb: '220040' } }, 'F0ECF9'),
  work: xlCell({ sz: 10 }),
  weekend: xlCell({ sz: 10 }, 'EEF0F3'),
  off: xlCell({ sz: 10, color: { rgb: '6B7280' } }, 'EEF0F3'),
  urlop: xlCell({ bold: true, sz: 10, color: { rgb: '0369A1' } }, 'E0F2FE'),
  closed: xlCell({ italic: true, sz: 10, color: { rgb: 'E5E7EB' } }, '4B5563'),
  holiday: xlCell({ bold: true, sz: 10, color: { rgb: 'B45309' } }, 'FEF3C7'),
  summary: xlCell({ bold: true, sz: 10, color: { rgb: '220040' } }, 'F0ECF9'),
  summaryLabel: xlCell({ bold: true, sz: 10, color: { rgb: '220040' } }, 'F0ECF9', 'left'),
  ok: xlCell({ bold: true, sz: 10, color: { rgb: '1B6F64' } }, 'F0ECF9'),
  bad: xlCell({ bold: true, sz: 10, color: { rgb: 'E6144B' } }, 'F0ECF9'),
};

function xlStyleForVal(val, day) {
  if (day.closed) return day.holiday ? XL.holiday : XL.closed;
  if (val === 'Wolne') return XL.off;
  if (val === 'Urlop') return XL.urlop;
  if (day.dow === 0 || day.dow === 6) return XL.weekend;
  return XL.work;
}

function exportExcel() {
  if (!state.lastSchedule) {
    alert('Najpierw wygeneruj grafik.');
    return;
  }
  if (typeof XLSX === 'undefined') {
    alert('Biblioteka Excel nie jest załadowana. Sprawdź połączenie z internetem lub folder vendor/xlsx.min.js, a następnie odśwież stronę.');
    return;
  }

  const { employees, curMonth, curYear } = state;
  const ls = state.lastSchedule;
  const { openDays, schedule, actualUrlop, actualWolne, requiredOff, roleCounts, freeSaturdays } = ls;
  const nEmp = employees.length;
  const names = employees.map(e => e.name);

  const ws = {};
  const range = { s: { r: 0, c: 0 }, e: { r: 0, c: nEmp + 1 } };

  const setCell = (r, c, value, style) => {
    const ref = XLSX.utils.encode_cell({ r, c });
    const cell = { v: value, t: typeof value === 'number' ? 'n' : 's' };
    if (style) cell.s = style;
    ws[ref] = cell;
    if (r > range.e.r) range.e.r = r;
    if (c > range.e.c) range.e.c = c;
  };

  setCell(0, 0, `Grafik pracy — Salon PLAY — ${MONTH_NAMES[curMonth - 1]} ${curYear}`, XL.title);
  for (let c = 1; c <= nEmp + 1; c++) setCell(0, c, '', XL.title);

  const headerR = 2;
  setCell(headerR, 0, 'Data', XL.header);
  setCell(headerR, 1, 'Dzień', XL.header);
  names.forEach((name, i) => setCell(headerR, 2 + i, name, XL.header));

  let r = headerR + 1;
  for (const day of openDays) {
    const dateLabel = `${String(day.d).padStart(2, '0')}.${String(curMonth).padStart(2, '0')}.${curYear}`;
    const dateStyle = day.holiday ? XL.holiday : (day.closed ? XL.closed : ((day.dow === 0 || day.dow === 6) ? XL.weekend : XL.work));
    setCell(r, 0, dateLabel, dateStyle);
    setCell(r, 1, DAY_NAMES[day.dow], dateStyle);
    for (let i = 0; i < nEmp; i++) {
      const e = employees[i];
      let val;
      if (day.closed) val = day.holiday ? 'święto' : 'zamknięte';
      else val = schedule[day.ds][e.id] || '';
      setCell(r, 2 + i, val, xlStyleForVal(val, day));
    }
    r++;
  }

  r++; // pusta linia

  const sumRows = [
    {
      label: 'Godziny łącznie',
      values: employees.map(e => totalHours(e, openDays, schedule, actualUrlop) + 'h'),
      styleFor: (e) => totalHours(e, openDays, schedule, actualUrlop) >= e.target ? XL.ok : XL.bad,
    },
    {
      label: 'Wymagany etat',
      values: employees.map(e => e.target + 'h'),
      styleFor: () => XL.summary,
    },
    {
      label: 'Bilans godzin',
      values: employees.map(e => {
        const d = totalHours(e, openDays, schedule, actualUrlop) - e.target;
        return (d > 0 ? '+' : '') + d + 'h';
      }),
      styleFor: (e) => {
        const d = totalHours(e, openDays, schedule, actualUrlop) - e.target;
        return d === 0 ? XL.ok : XL.bad;
      },
    },
    {
      label: 'Dni wolne',
      values: employees.map(e => `${actualWolne?.[e.id] ?? '—'} / min: ${requiredOff?.[e.id] ?? '—'}`),
      styleFor: (e) => (actualWolne?.[e.id] ?? 0) >= (requiredOff?.[e.id] ?? 0) ? XL.ok : XL.bad,
    },
    {
      label: 'Urlop',
      values: employees.map(e => (actualUrlop?.[e.id] ?? 0) + ' dni'),
      styleFor: () => XL.summary,
    },
    {
      label: 'Otwarcia (8:30–16:30)',
      values: employees.map(e => roleCounts?.[e.id]?.open ?? 0),
      styleFor: () => XL.summary,
    },
    {
      label: 'Zamknięcia (13:00–21:00)',
      values: employees.map(e => roleCounts?.[e.id]?.close ?? 0),
      styleFor: () => XL.summary,
    },
    {
      label: 'Zmiany środkowe',
      values: employees.map(e => roleCounts?.[e.id]?.mid ?? 0),
      styleFor: () => XL.summary,
    },
    {
      label: 'Wolne soboty',
      values: employees.map(e => freeSaturdays?.[e.id] ?? 0),
      styleFor: () => XL.summary,
    },
  ];

  for (const row of sumRows) {
    setCell(r, 0, row.label, XL.summaryLabel);
    setCell(r, 1, '', XL.summaryLabel);
    employees.forEach((e, i) => setCell(r, 2 + i, row.values[i], row.styleFor(e)));
    r++;
  }

  ws['!ref'] = XLSX.utils.encode_range(range);
  ws['!cols'] = [{ wch: 14 }, { wch: 8 }, ...employees.map(() => ({ wch: 16 }))];
  ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: nEmp + 1 } }];
  ws['!freeze'] = { xSplit: 2, ySplit: headerR + 1 };

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Grafik');
  XLSX.writeFile(wb, `Grafik_${MONTH_NAMES[curMonth - 1]}_${curYear}.xlsx`);
}

/** Eksport JPG → pozioma A4 (297×210 mm) z małym marginesem (~5 mm). */
const A4_DPI = 200;
const A4_MM = { w: 297, h: 210 }; // landscape
const A4_PX = {
  w: Math.round((A4_MM.w / 25.4) * A4_DPI), // ≈ 2339
  h: Math.round((A4_MM.h / 25.4) * A4_DPI), // ≈ 1654
};
const A4_MARGIN_PX = Math.round((5 / 25.4) * A4_DPI); // ~5 mm

/** Przycina prawie-białe marginesy ze zrzutu (żeby tabela nie miała „ramki” pustki). */
function cropCanvasWhitespace(srcCanvas, threshold) {
  threshold = threshold == null ? 248 : threshold;
  try {
    const w = srcCanvas.width;
    const h = srcCanvas.height;
    const ctx = srcCanvas.getContext('2d');
    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    let top = 0, bottom = h - 1, left = 0, right = w - 1;
    const isInk = (i) => {
      const a = d[i + 3];
      if (a < 8) return false;
      return d[i] < threshold || d[i + 1] < threshold || d[i + 2] < threshold;
    };
    // top
    outerTop:
    for (; top < h; top++) {
      for (let x = 0; x < w; x++) if (isInk((top * w + x) * 4)) break outerTop;
    }
    // bottom
    outerBottom:
    for (; bottom > top; bottom--) {
      for (let x = 0; x < w; x++) if (isInk((bottom * w + x) * 4)) break outerBottom;
    }
    // left
    outerLeft:
    for (; left < w; left++) {
      for (let y = top; y <= bottom; y++) if (isInk((y * w + left) * 4)) break outerLeft;
    }
    // right
    outerRight:
    for (; right > left; right--) {
      for (let y = top; y <= bottom; y++) if (isInk((y * w + right) * 4)) break outerRight;
    }
    const cw = right - left + 1;
    const ch = bottom - top + 1;
    if (cw < 8 || ch < 8) return srcCanvas;
    // mały zapas 2 px, żeby nie uciąć obramowania tabeli
    const pad = 2;
    const sx = Math.max(0, left - pad);
    const sy = Math.max(0, top - pad);
    const sw = Math.min(w - sx, cw + pad * 2);
    const sh = Math.min(h - sy, ch + pad * 2);
    const out = document.createElement('canvas');
    out.width = sw;
    out.height = sh;
    out.getContext('2d').drawImage(srcCanvas, sx, sy, sw, sh, 0, 0, sw, sh);
    return out;
  } catch (_) {
    return srcCanvas;
  }
}

function fitCanvasToA4(srcCanvas) {
  const out = document.createElement('canvas');
  out.width = A4_PX.w;
  out.height = A4_PX.h;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, out.width, out.height);

  if (!srcCanvas || !srcCanvas.width || !srcCanvas.height) return out;

  // Usuń pustą biel wokół tabeli, potem rozciągnij na CAŁĄ szerokość (i wysokość) obszaru A4
  const cropped = cropCanvasWhitespace(srcCanvas);
  const maxW = A4_PX.w - A4_MARGIN_PX * 2;
  const maxH = A4_PX.h - A4_MARGIN_PX * 2;
  if (maxW <= 0 || maxH <= 0) return out;

  // Pełna szerokość + pełna wysokość obszaru roboczego (pozioma A4, margines ~5 mm)
  const dx = A4_MARGIN_PX;
  const dy = A4_MARGIN_PX;
  const dw = maxW;
  const dh = maxH;

  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(cropped, 0, 0, cropped.width, cropped.height, dx, dy, dw, dh);
  return out;
}

/** Sprawdza, czy canvas nie jest prawie całkowicie biały (pusty zrzut). */
function isCanvasBlank(canvas) {
  try {
    const ctx = canvas.getContext('2d');
    const w = Math.min(canvas.width, 80);
    const h = Math.min(canvas.height, 80);
    if (w < 2 || h < 2) return true;
    const data = ctx.getImageData(0, 0, w, h).data;
    let nonWhite = 0;
    for (let i = 0; i < data.length; i += 16) {
      const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
      if (a > 10 && (r < 250 || g < 250 || b < 250)) nonWhite++;
    }
    return nonWhite < 3;
  } catch (_) {
    return false;
  }
}

async function exportJpg() {
  if (!state.lastSchedule) {
    alert('Najpierw wygeneruj grafik.');
    return;
  }
  const panel = document.querySelector('#output .panel');
  if (!panel) {
    alert('Brak wygenerowanego grafiku do eksportu.');
    return;
  }
  if (typeof html2canvas !== 'function') {
    alert('Biblioteka JPG (html2canvas) nie jest załadowana. Sprawdź połączenie z internetem lub folder vendor/html2canvas.min.js, a następnie odśwież stronę (Ctrl+F5).');
    return;
  }

  const { curMonth, curYear } = state;
  const btn = document.querySelector('[data-action="export-jpg"]');
  const prev = btn ? btn.textContent : '';
  if (btn) { btn.textContent = 'Generuję…'; btn.disabled = true; }

  let exportRoot = null;
  try {
    // Upewnij się, że widok generatora jest widoczny (inaczej clone ma 0×0)
    const genView = document.getElementById('view-generator');
    if (genView && genView.hidden) {
      setAppView('generator');
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    }

    // Osobny kontener poza ekranem — stabilniejszy zrzut niż żywy panel (GitHub Pages / SW)
    exportRoot = document.createElement('div');
    exportRoot.id = 'jpg-export-root';

    const clone = panel.cloneNode(true);
    // Usuń kontrolki UI z klona
    clone.querySelectorAll('.match-bar, .row-actions, .lock-bar, .schedule-lock-all-bar, select.cell-edit, .help-tip, .btn-emp-lock, .btn-day-lock').forEach(el => el.remove());
    // Pokaż etykiety komórek (bez trybu edycji)
    clone.querySelectorAll('td.editable-cell').forEach(td => {
      td.classList.remove('editing', 'locked-cell');
    });
    clone.querySelectorAll('.cell-label').forEach(span => {
      span.style.display = '';
    });
    // Usuń overflow wrapper constraint
    clone.querySelectorAll('div[style*="overflow"]').forEach(div => {
      div.style.overflow = 'visible';
      div.style.overflowX = 'visible';
      div.style.width = 'auto';
      div.style.maxWidth = 'none';
    });

    exportRoot.appendChild(clone);
    document.body.appendChild(exportRoot);

    // Tabela na pełną szerokość zrzutu (potem rozciągana na całą szerokość A4)
    const nEmp = state.employees.length || 1;
    const table = exportRoot.querySelector('.sched-table');
    // Szerokość zbliżona do proporcji poziomej A4 (przy html2canvas scale:2 → ~1400–1800 px)
    const targetTableW = Math.max(1400, 160 + 50 + nEmp * 140);
    if (table) {
      table.style.tableLayout = 'fixed';
      table.style.width = targetTableW + 'px';
      table.style.minWidth = targetTableW + 'px';
      table.style.maxWidth = 'none';
      const ths = table.querySelectorAll('thead th');
      const empW = Math.floor((targetTableW - 130) / Math.max(nEmp, 1));
      ths.forEach((th, i) => {
        if (i === 0) th.style.width = '90px';
        else if (i === 1) th.style.width = '40px';
        else th.style.width = empW + 'px';
      });
      table.querySelectorAll('tbody td').forEach((td, idx) => {
        // nie ustawiamy per-cell; table-layout:fixed + th wystarczy
      });
    }
    const panelEl = exportRoot.querySelector('.panel');
    if (panelEl) {
      panelEl.style.width = targetTableW + 'px';
      panelEl.style.maxWidth = 'none';
      panelEl.style.padding = '6px 0 0';
    }
    exportRoot.style.width = targetTableW + 'px';
    exportRoot.style.padding = '0';

    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    const rect = exportRoot.getBoundingClientRect();
    if (rect.width < 10 || rect.height < 10) {
      throw new Error('Kontener eksportu ma zerowy rozmiar');
    }

    // scale: 2 — wystarczająco ostre, mniej ryzyka OOM / pustego canvasu
    const canvas = await html2canvas(exportRoot, {
      backgroundColor: '#ffffff',
      scale: 2,
      useCORS: true,
      allowTaint: true,
      logging: false,
      scrollX: 0,
      scrollY: 0,
      x: 0,
      y: 0,
      width: Math.ceil(exportRoot.scrollWidth),
      height: Math.ceil(exportRoot.scrollHeight),
      windowWidth: Math.ceil(exportRoot.scrollWidth) + 40,
      windowHeight: Math.ceil(exportRoot.scrollHeight) + 40,
      onclone: (doc) => {
        const root = doc.getElementById('jpg-export-root');
        if (!root) return;
        root.style.position = 'static';
        root.style.left = '0';
        root.style.top = '0';
        root.style.zIndex = '0';
      },
    });

    if (!canvas || canvas.width < 2 || canvas.height < 2 || isCanvasBlank(canvas)) {
      throw new Error('Zrzut grafiku jest pusty. Odśwież stronę (Ctrl+F5) i spróbuj ponownie.');
    }

    const a4Canvas = fitCanvasToA4(canvas);

    const a = document.createElement('a');
    a.download = `Grafik_${MONTH_NAMES[curMonth - 1]}_${curYear}_A4.jpg`;
    a.href = a4Canvas.toDataURL('image/jpeg', 0.92);
    document.body.appendChild(a);
    a.click();
    a.remove();
  } catch (err) {
    console.error(err);
    alert('Błąd podczas generowania JPG: ' + (err && err.message ? err.message : String(err)));
  } finally {
    if (exportRoot && exportRoot.parentNode) exportRoot.parentNode.removeChild(exportRoot);
    if (btn) { btn.textContent = prev; btn.disabled = false; }
  }
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-action]');
  if (!el) return;

  switch (el.dataset.action) {
    case 'save-all':       saveAllData(); break;
    case 'add-employee':   addEmployee(); break;
    case 'remove-employee': removeEmployee(el.dataset.emp); break;
    case 'month-change':   onMonthChange(); break;
    case 'clear-prefs':    clearPreferences(); break;
    case 'generate':       generateSchedule(); break;
    case 'export-excel':   exportExcel(); break;
    case 'export-jpg':     exportJpg(); break;
    case 'toggle-lock-all': toggleLockAllScheduleCells(); break;
    case 'toggle-lock-emp': toggleEmployeeScheduleLock(el.dataset.emp); break;
    case 'toggle-lock-day': toggleDayScheduleLock(el.dataset.ds); break;
    case 'set-view':       setAppView(el.dataset.view); break;
    case 'match-schedule': {
      const targetId = document.getElementById('matchTargetSel')?.value;
      const sourceId = document.getElementById('matchSourceSel')?.value;
      if (!targetId || !sourceId) break;
      if (targetId === sourceId) {
        alert('Wybierz dwóch różnych pracowników.');
        break;
      }
      const targetName = state.employees.find(e => e.id === targetId)?.name || 'docelowy';
      const sourceName = state.employees.find(e => e.id === sourceId)?.name || 'źródłowy';
      if (!confirm(`Skopiować grafik „${sourceName}” na „${targetName}”?\nZablokowane komórki u „${targetName}” nie zostaną zmienione.`)) break;
      matchScheduleFromTo(targetId, sourceId);
      break;
    }
    case 'undo-schedule': undoScheduleChange(); break;
    case 'redo-schedule': redoScheduleChange(); break;
  }
});

document.addEventListener('change', ev => {
  const el = ev.target;

  if (el.dataset.field && el.dataset.emp) {
    const val = el.type === 'checkbox' ? el.checked : el.value;
    updateEmp(el.dataset.emp, el.dataset.field, val);
    return;
  }
  if (el.dataset.action === 'toggle-sunday') {
    toggleSunday(el.dataset.date, el.checked);
    return;
  }
  if (el.dataset.action === 'holidays-input') {
    applyHolidaysFromInput(el.value);
    return;
  }
  if (el.dataset.action === 'set-pref') {
    setPref(el.dataset.date, el.dataset.emp, el.value);
    applyPrefVisual(el, el.value);
  }
});

document.addEventListener('input', ev => {

// Ręczna edycja komórek grafiku
document.addEventListener('click', ev => {
  const cell = ev.target.closest('td.editable-cell');
  if (!cell || ev.target.tagName === 'SELECT') return;
  document.querySelectorAll('td.editable-cell.editing').forEach(c => c.classList.remove('editing'));
  cell.classList.add('editing');
  const sel = cell.querySelector('select.cell-edit');
  if (sel) {
    sel.focus();
    // Pokaż listę od razu, gdzie przeglądarka pozwala
    if (typeof sel.showPicker === 'function') {
      try { sel.showPicker(); } catch (_) { /* ignore */ }
    }
  }
});

// Prawy przycisk: zablokuj / odblokuj komórkę
document.addEventListener('contextmenu', ev => {
  const cell = ev.target.closest('td.editable-cell');
  if (!cell) return;
  ev.preventDefault();
  const ds = cell.dataset.ds;
  const empId = cell.dataset.emp;
  if (ds && empId) toggleCellLock(ds, empId);
});

document.addEventListener('change', ev => {
  const sel = ev.target;
  if (!sel.classList.contains('cell-edit')) return;
  onCellEdit(sel.dataset.ds, sel.dataset.emp, sel.value);
});

document.addEventListener('focusout', ev => {
  const cell = ev.target.closest?.('td.editable-cell');
  if (!cell) return;
  setTimeout(() => {
    if (!cell.contains(document.activeElement)) cell.classList.remove('editing');
  }, 0);
});

const APP_VIEWS = ['options', 'employee-prefs', 'generator'];

function setAppView(view) {
  if (!APP_VIEWS.includes(view)) view = 'options';

  const panels = {
    options: document.getElementById('view-options'),
    'employee-prefs': document.getElementById('view-employee-prefs'),
    generator: document.getElementById('view-generator'),
  };
  const buttons = {
    options: document.getElementById('btnViewOptions'),
    'employee-prefs': document.getElementById('btnViewEmployeePrefs'),
    generator: document.getElementById('btnViewGenerator'),
  };

  for (const key of APP_VIEWS) {
    if (panels[key]) panels[key].hidden = key !== view;
    if (buttons[key]) {
      const active = key === view;
      buttons[key].classList.toggle('active', active);
      buttons[key].setAttribute('aria-selected', String(active));
    }
  }

  storageSet('ui:appView', view);
}

(function init() {
  initMonthPickers();
  loadEmployees();
  onMonthChange();
  const savedView = storageGet('ui:appView', 'options');
  // migracja ze starych kluczy prefs / prefs+generator
  const mapped = savedView === 'prefs' ? 'options'
    : (APP_VIEWS.includes(savedView) ? savedView : 'options');
  setAppView(mapped);
})();

// === Jednolite dymki (zawsze w obrębie viewportu) ===
(function initAppTooltips() {
  let tipEl = document.getElementById('app-tooltip');
  if (!tipEl) {
    tipEl = document.createElement('div');
    tipEl.id = 'app-tooltip';
    tipEl.setAttribute('role', 'tooltip');
    tipEl.innerHTML = '<span class="tip-text"></span><span class="tip-arrow" aria-hidden="true"></span>';
    document.body.appendChild(tipEl);
  }
  const textEl = () => tipEl.querySelector('.tip-text');

  const PAD = 8;

  function hideTip() {
    tipEl.classList.remove('is-visible', 'tip-above', 'tip-below');
    tipEl._anchor = null;
  }

  function placeTip(anchor) {
    const tipText = anchor.getAttribute('data-tip');
    if (!tipText) {
      hideTip();
      return;
    }
    tipEl._anchor = anchor;
    textEl().textContent = tipText;
    tipEl.classList.add('is-visible');
    tipEl.classList.remove('tip-above', 'tip-below');

    // Najpierw zmierz bez ograniczeń pozycji
    tipEl.style.left = '0px';
    tipEl.style.top = '0px';
    const tipW = tipEl.offsetWidth;
    const tipH = tipEl.offsetHeight;
    const r = anchor.getBoundingClientRect();
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    // Preferuj nad elementem; jeśli nie mieści się — pod
    let above = r.top >= tipH + PAD + 6;
    if (!above && r.bottom + tipH + PAD + 6 > vh) {
      // Wybierz stronę z większą ilością miejsca
      above = r.top >= vh - r.bottom;
    }

    let top = above
      ? r.top - tipH - 10
      : r.bottom + 10;
    top = Math.max(PAD, Math.min(top, vh - tipH - PAD));

    // Wyśrodkuj względem elementu, przytnij do krawędzi
    let left = r.left + r.width / 2 - tipW / 2;
    left = Math.max(PAD, Math.min(left, vw - tipW - PAD));

    tipEl.style.left = `${Math.round(left)}px`;
    tipEl.style.top = `${Math.round(top)}px`;
    tipEl.classList.add(above ? 'tip-above' : 'tip-below');

    // Strzałka względem środka elementu
    const anchorMid = r.left + r.width / 2;
    const arrowLeft = Math.max(12, Math.min(tipW - 12, anchorMid - left));
    tipEl.style.setProperty('--arrow-left', `${Math.round(arrowLeft)}px`);
  }

  function findTipTarget(node) {
    if (!node || !node.closest) return null;
    return node.closest('[data-tip]');
  }

  document.addEventListener('mouseover', (ev) => {
    const t = findTipTarget(ev.target);
    if (!t) return;
    // Nie pokazuj dymka, gdy kursor jest nad samym selectem w komórce (edycja)
    if (ev.target.closest && ev.target.closest('select.cell-edit')) return;
    placeTip(t);
  });

  document.addEventListener('mouseout', (ev) => {
    const t = findTipTarget(ev.target);
    if (!t) return;
    const to = ev.relatedTarget;
    if (to && t.contains(to)) return;
    if (tipEl._anchor === t) hideTip();
  });

  document.addEventListener('focusin', (ev) => {
    const t = findTipTarget(ev.target);
    if (t) placeTip(t);
  });

  document.addEventListener('focusout', (ev) => {
    const t = findTipTarget(ev.target);
    if (t && tipEl._anchor === t) hideTip();
  });

  window.addEventListener('scroll', () => {
    if (tipEl._anchor && tipEl.classList.contains('is-visible')) {
      placeTip(tipEl._anchor);
    }
  }, true);

  window.addEventListener('resize', hideTip);
})();


// === Podgląd pełnej etykiety przy wąskim polu nazwy ===
(function initInputLiveTip() {
  let tipEl = document.getElementById('input-live-tip');
  if (!tipEl) {
    tipEl = document.createElement('div');
    tipEl.id = 'input-live-tip';
    tipEl.setAttribute('role', 'status');
    tipEl.setAttribute('aria-live', 'polite');
    tipEl.innerHTML = '<span class="tip-text"></span><span class="tip-arrow" aria-hidden="true"></span>';
    document.body.appendChild(tipEl);
  }
  const textEl = () => tipEl.querySelector('.tip-text');
  const PAD = 8;
  let activeInput = null;

  function hide() {
    tipEl.classList.remove('is-visible', 'tip-above', 'tip-below', 'is-empty');
    activeInput = null;
  }

  function place(input) {
    if (!input || !input.isConnected) {
      hide();
      return;
    }
    activeInput = input;
    const raw = input.value;
    const empty = !String(raw).trim();
    textEl().textContent = empty ? 'Etykieta pracownika…' : raw;
    tipEl.classList.toggle('is-empty', empty);
    tipEl.classList.add('is-visible');
    tipEl.classList.remove('tip-above', 'tip-below');

    tipEl.style.left = '0px';
    tipEl.style.top = '0px';
    const tipW = tipEl.offsetWidth;
    const tipH = tipEl.offsetHeight;
    const r = input.getBoundingClientRect();
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    let above = r.top >= tipH + PAD + 6;
    if (!above && r.bottom + tipH + PAD + 6 > vh) {
      above = r.top >= vh - r.bottom;
    }

    let top = above ? r.top - tipH - 10 : r.bottom + 10;
    top = Math.max(PAD, Math.min(top, vh - tipH - PAD));

    let left = r.left;
    left = Math.max(PAD, Math.min(left, vw - tipW - PAD));

    tipEl.style.left = `${Math.round(left)}px`;
    tipEl.style.top = `${Math.round(top)}px`;
    tipEl.classList.add(above ? 'tip-above' : 'tip-below');

    const anchorMid = r.left + Math.min(r.width, tipW) / 2;
    const arrowLeft = Math.max(12, Math.min(tipW - 12, anchorMid - left));
    tipEl.style.setProperty('--arrow-left', `${Math.round(arrowLeft)}px`);
  }

  function isNameInput(el) {
    return el && el.matches && el.matches('#empTable input[type="text"][data-field="name"]');
  }

  document.addEventListener('focusin', (ev) => {
    if (isNameInput(ev.target)) place(ev.target);
  });

  document.addEventListener('focusout', (ev) => {
    if (isNameInput(ev.target)) {
      // delay so click elsewhere still works; hide if focus left the field
      setTimeout(() => {
        if (activeInput === ev.target && document.activeElement !== ev.target) hide();
      }, 0);
    }
  });

  document.addEventListener('input', (ev) => {
    if (isNameInput(ev.target)) place(ev.target);
  });

  window.addEventListener('scroll', () => {
    if (activeInput) place(activeInput);
  }, true);

  window.addEventListener('resize', () => {
    if (activeInput) place(activeInput);
    else hide();
  });
})();

// Rejestracja Service Workera — pozwala zainstalować aplikację (PWA) i używać
// jej offline po pierwszym otwarciu. Wymaga serwowania przez http(s)/localhost —
// nie zadziała przy otwarciu pliku bezpośrednio przez file://.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      try { reg.update(); } catch (_) {}
    }).catch(err => {
      console.warn('Nie udało się zarejestrować service workera:', err);
    });
  });
}
