<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator grafiku — Salon PLAY</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#220040">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<script src="vendor/xlsx.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'"></script>
<script src="vendor/html2canvas.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Play brand tokens (play.pl design system) */
    --play-purple: #6c43bf;          /* purple500 */
    --play-purple-dark: #220040;     /* primary brand dark */
    --play-purple-mid: #48227d;      /* purple700 */
    --play-purple-deep: #201339;     /* secondary dark */
    --play-purple-light: #f0ecf9;    /* container accent secondary light */
    --play-purple-soft: #e4dcf3;
    --play-cyan: #00c8ff;            /* CTA accent on play.pl */
    --play-yellow: #fff200;          /* promo yellow */
    --ink: #26232c;                  /* gray900 */
    --ink-soft: #3d3a44;
    --muted: #6f6c74;                /* gray600 */
    --paper: #f7f7f7;                /* gray100 light */
    --panel: #ffffff;
    --line: #e8e4ef;
    --line-strong: #d6d6d6;          /* gray200 */
    --good: #1b6f64;
    --good-bg: #ecfdf5;
    --bad: #e6144b;                  /* brand sticker / alert red */
    --bad-bg: #fef2f5;
    --warn: #b45309;
    --warn-bg: #fffbeb;
    --sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
    --radius: 16px;
    --radius-sm: 10px;
    --radius-xs: 8px;
    --content-max: 1180px;
    --shadow-sm: 0 1px 2px rgba(34, 0, 64, 0.05);
    --shadow-md: 0 4px 16px rgba(34, 0, 64, 0.08), 0 1px 3px rgba(34, 0, 64, 0.04);
    --shadow-lg: 0 10px 32px rgba(34, 0, 64, 0.12), 0 2px 6px rgba(34, 0, 64, 0.05);
    --focus-ring: 0 0 0 3px rgba(108, 67, 191, 0.28);
  }

  * { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
  }

  body {
    margin: 0;
    background:
      radial-gradient(1200px 600px at 8% -12%, rgba(108, 67, 191, 0.10), transparent 55%),
      radial-gradient(900px 500px at 100% 0%, rgba(34, 0, 64, 0.06), transparent 50%),
      var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    padding: 16px 14px 40px;
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    letter-spacing: -0.01em;
  }

  h1 {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
    color: #fff;
    white-space: nowrap;
    line-height: 1.25;
  }

  @media (min-width: 640px) {
    h1 { font-size: 17px; }
  }

  .top-bar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .top-bar-logo {
    height: 42px;
    width: auto;
    display: block;
    flex-shrink: 0;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.18));
  }


  /* ——— View switcher ——— */
  .view-switch {
    display: flex;
    max-width: var(--content-max);
    margin: 0 auto 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 5px;
    gap: 4px;
    box-shadow: var(--shadow-sm);
    width: fit-content;
    max-width: calc(100% - 4px);
    flex-wrap: wrap;
    justify-content: center;
  }

  .view-switch button {
    background: transparent;
    color: var(--play-purple-dark);
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 10px 16px;
    border-radius: 9px;
    border: none;
    box-shadow: none;
    transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  }

  .view-switch button:hover {
    background: var(--play-purple-light);
  }

  .view-switch button.active {
    background: var(--play-purple);
    color: #fff;
    box-shadow: 0 2px 10px rgba(34, 0, 64, 0.35);
  }

  .view-panel {
    max-width: var(--content-max);
    width: 100%;
    margin: 0 auto;
  }

  .view-panel[hidden] {
    display: none !important;
  }

  #view-options .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    max-width: none;
  }

  #view-generator {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  #view-generator .generate-bar,
  #view-generator #warnings,
  #view-generator #output {
    max-width: none;
    width: 100%;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    max-width: var(--content-max);
  }

  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    #view-options .grid { grid-template-columns: 1fr; }
  }

  /* ——— Panels ——— */
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow-md);
  }

  .panel h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--play-purple);
    margin: 0;
    font-weight: 800;
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--play-purple-soft);
    gap: 10px;
  }

  /* ——— Tables ——— */
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
  }

  th, td {
    border: 1px solid var(--line);
    padding: 6px 8px;
    text-align: center;
  }

  th {
    background: var(--play-purple-light);
    color: var(--play-purple-dark);
    font-weight: 700;
    font-size: 11.5px;
    letter-spacing: 0.01em;
    vertical-align: middle;
  }

  #empTable th {
    vertical-align: middle;
    padding: 10px 8px;
  }

  /* ——— Form controls ——— */
  input[type=text],
  input[type=number],
  select {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-xs);
    padding: 7px 9px;
    width: 100%;
    background: #fff;
    color: var(--ink);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    line-height: 1.3;
  }

  input:hover, select:hover {
    border-color: #c4b5d0;
  }

  input:focus, select:focus {
    border-color: var(--play-purple-mid);
    outline: none;
    box-shadow: var(--focus-ring);
  }

  input[type=number] {
    width: 72px;
    text-align: center;
  }

  input[type=checkbox] {
    width: 16px;
    height: 16px;
    accent-color: var(--play-purple);
    cursor: pointer;
  }

  .row-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  /* ——— Buttons ——— */
  button {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 13px;
    border: none;
    border-radius: var(--radius-sm);
    padding: 9px 14px;
    cursor: pointer;
    transition: background 0.14s ease, transform 0.08s ease, box-shadow 0.14s ease, color 0.14s ease;
    line-height: 1.25;
  }

  button:active {
    transform: scale(0.98);
  }

  .btn-primary {
    background: var(--play-purple);
    color: #fff;
    box-shadow: 0 2px 10px rgba(108, 67, 191, 0.30);
  }

  .btn-primary:hover {
    background: var(--play-purple-dark);
  }

  .btn-secondary {
    background: var(--play-purple-light);
    color: var(--play-purple-dark);
    border: 1px solid var(--play-purple-soft);
  }

  .btn-secondary:hover {
    background: var(--play-purple-soft);
  }

  .btn-ghost {
    background: transparent;
    color: var(--bad);
    text-decoration: none;
    padding: 4px 8px;
    font-size: 12px;
    font-weight: 600;
    box-shadow: none;
    border-radius: var(--radius-xs);
  }

  .btn-ghost:hover {
    background: var(--bad-bg);
  }

  .month-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .month-row select {
    width: auto;
    min-width: 120px;
  }

  /* ——— Generate bar ——— */
  .generate-bar {
    max-width: var(--content-max);
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px 16px;
    background: linear-gradient(135deg, #220040 0%, #48227d 45%, #6c43bf 100%);
    padding: 14px 16px;
    border-radius: var(--radius);
    box-shadow: 0 6px 20px rgba(34, 0, 64, 0.35);
  }

  .generate-bar-lock {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .generate-bar > button[data-action="generate"],
  .top-bar .btn-on-purple {
    background: #fff;
    color: var(--play-purple-dark);
    font-size: 13.5px;
    font-weight: 800;
    letter-spacing: 0.02em;
    padding: 11px 22px;
    white-space: nowrap;
    border-radius: var(--radius-sm);
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    border: none;
  }

  .generate-bar > button[data-action="generate"]:hover,
  .top-bar .btn-on-purple:hover {
    background: #f7f4fc;
  }

  /* Same type size as GENERUJ GRAFIK — consistent bar actions */
  .generate-bar .btn-lock-toggle {
    padding: 11px 18px;
    font-size: 13.5px;
    font-weight: 800;
    letter-spacing: 0.02em;
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
    border: 1.5px solid rgba(255, 255, 255, 0.45);
    box-shadow: none;
  }

  .generate-bar .btn-lock-toggle:hover {
    background: rgba(255, 255, 255, 0.26);
    border-color: rgba(255, 255, 255, 0.7);
  }

  .generate-bar .btn-lock-toggle.is-locked {
    background: #fff;
    color: var(--play-purple-dark);
    border: 1.5px solid #fff;
  }

  .generate-bar .btn-lock-toggle.is-locked:hover {
    background: #f7f4fc;
  }

  body.exporting-jpg .sched-table td.editable-cell.locked-cell {
    box-shadow: none;
  }

  body.exporting-jpg .sched-table td.editable-cell.locked-cell .cell-label::after {
    content: none;
  }

  /* Kontener poza ekranem używany wyłącznie do zrzutu JPG */
  #jpg-export-root {
    position: fixed;
    left: -12000px;
    top: 0;
    z-index: -1;
    background: #ffffff;
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #26232c;
  }
  #jpg-export-root .match-bar,
  #jpg-export-root .row-actions,
  #jpg-export-root .lock-bar {
    display: none !important;
  }
  #jpg-export-root .panel {
    box-shadow: none !important;
    border: none;
    border-radius: 0;
    background: #fff;
    max-width: none;
    width: 100%;
    margin: 0;
    padding: 8px 0 0;
  }
  #jpg-export-root .panel-header {
    padding: 0 0 8px;
    margin: 0 0 8px;
  }
  #jpg-export-root .sched-legend {
    flex-wrap: wrap;
  }
  #jpg-export-root .sched-table {
    font-size: 11px;
    table-layout: fixed;
    width: 100%;
    border-collapse: collapse;
  }
  #jpg-export-root .sched-table th,
  #jpg-export-root .sched-table td {
    padding: 4px 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #jpg-export-root .sched-table td.editable-cell.locked-cell {
    box-shadow: none !important;
  }
  #jpg-export-root .sched-table td.editable-cell.locked-cell .cell-label::after {
    content: none !important;
  }
  #jpg-export-root .cell-edit {
    display: none !important;
  }
  #jpg-export-root .cell-label {
    display: inline !important;
  }
  #jpg-export-root .help-tip {
    display: none !important;
  }

  /* ——— Warnings ——— */
  #warnings {
    max-width: var(--content-max);
    margin: 0;
    display: flex;
    justify-content: flex-end;
    position: relative;
    z-index: 50;
    gap: 8px;
  }

  #warnings:empty { display: none; }

  .warn-badge {
    position: relative;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #dc2626;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(185, 28, 28, 0.4);
    user-select: none;
    border: 2px solid #fff;
    transition: transform 0.12s ease;
  }

  .warn-badge:hover {
    transform: scale(1.06);
  }

  .warn-badge.warn-soft {
    background: #d97706;
    box-shadow: 0 4px 14px rgba(180, 83, 9, 0.35);
  }

  .warn-badge .warn-count {
    position: absolute;
    top: -6px;
    right: -6px;
    min-width: 20px;
    height: 20px;
    padding: 0 5px;
    border-radius: 999px;
    background: #fff;
    color: #dc2626;
    font-size: 11.5px;
    font-weight: 800;
    line-height: 20px;
    text-align: center;
    border: 2px solid #dc2626;
    box-sizing: border-box;
  }

  .warn-badge.warn-soft .warn-count {
    color: #d97706;
    border-color: #d97706;
  }

  .warn-tooltip {
    display: none;
    position: absolute;
    top: 54px;
    right: 0;
    width: min(400px, calc(100vw - 24px));
    max-height: 360px;
    overflow-y: auto;
    background: #fff;
    border: 1px solid #fecaca;
    border-radius: 12px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.16);
    padding: 6px 0;
    z-index: 10000;
  }

  .warn-badge.warn-soft .warn-tooltip { border-color: #fde68a; }

  .warn-tooltip::before {
    content: "";
    position: absolute;
    top: -6px;
    right: 16px;
    width: 12px;
    height: 12px;
    background: #fff;
    border-left: 1px solid #fecaca;
    border-top: 1px solid #fecaca;
    transform: rotate(45deg);
  }

  .warn-badge.warn-soft .warn-tooltip::before {
    border-left-color: #fde68a;
    border-top-color: #fde68a;
  }

  .warn-badge:hover .warn-tooltip,
  .warn-badge:focus-within .warn-tooltip,
  .warn-badge.is-open .warn-tooltip {
    display: block;
  }

  .warn-item {
    font-size: 12.5px;
    color: #b91c1c;
    padding: 9px 14px;
    line-height: 1.45;
    border-bottom: 1px solid #fef2f2;
    font-weight: 500;
    text-align: left;
  }

  .warn-item.warn-soft-item {
    color: #b45309;
    border-bottom-color: #fef3c7;
  }

  .warn-item:last-child { border-bottom: none; }
  .warn-item::before { content: "⚠️ "; }
  .warn-item.warn-soft-item::before { content: "⚡ "; }

  #output {
    max-width: var(--content-max);
    min-width: 0;
    width: 100%;
  }

  /* ——— Schedule table ——— */
  .sched-table {
    font-size: 12px;
    table-layout: fixed;
    width: 100%;
  }

  .sched-table th,
  .sched-table td {
    padding: 5px 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sched-table th {
    font-size: 11px;
    padding: 7px 6px;
    font-weight: 700;
  }

  .sched-table th:nth-child(1),
  .sched-table td:nth-child(1) {
    width: 118px;
    text-align: center;
  }

  .sched-table th:nth-child(2),
  .sched-table td:nth-child(2) { width: 42px; }

  .sched-table th:nth-child(n+3),
  .sched-table td:nth-child(n+3) {
    width: 100px;
  }

  .emp-sched-th {
    vertical-align: middle;
  }
  .emp-col-head {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    max-width: 100%;
  }
  .emp-col-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .btn-emp-lock {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    padding: 0;
    border-radius: 6px;
    border: 1px solid var(--play-purple-soft);
    background: #fff;
    color: #9a3412;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    box-shadow: none;
    font-weight: 700;
  }
  .btn-emp-lock:hover {
    background: #fff7ed;
    border-color: #fdba74;
  }
  body.exporting-jpg .btn-emp-lock,
  #jpg-export-root .btn-emp-lock,
  body.exporting-jpg .btn-day-lock,
  #jpg-export-root .btn-day-lock,
  body.exporting-jpg .schedule-lock-all-bar,
  #jpg-export-root .schedule-lock-all-bar {
    display: none !important;
  }

  .day-row-head {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 24px;
  }
  .day-date-label {
    white-space: nowrap;
    line-height: 1.2;
    text-align: center;
  }
  .btn-day-lock {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    z-index: 1;
    width: 22px;
    height: 22px;
    min-width: 22px;
    box-sizing: border-box;
    padding: 0;
    border-radius: 6px;
    border: 1px solid var(--play-purple-soft);
    background: #fff;
    color: #9a3412;
    font-size: 11px;
    line-height: 1;
    cursor: pointer;
    box-shadow: none;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .btn-day-lock:hover {
    background: #fff7ed;
    border-color: #fdba74;
  }
  .sched-table td.day-date-cell {
    text-align: center;
    position: relative;
    padding-left: 4px;
    padding-right: 4px;
  }

  .schedule-lock-all-bar {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    padding: 4px 0 10px;
  }
  .schedule-lock-all-bar .btn-lock-toggle {
    padding: 9px 14px;
    font-size: 12.5px;
    font-weight: 800;
    letter-spacing: 0.02em;
    border-radius: var(--radius-sm);
    background: #fff7ed;
    color: #9a3412;
    border: 1px solid #fdba74;
    box-shadow: none;
    cursor: pointer;
  }
  .schedule-lock-all-bar .btn-lock-toggle:hover {
    background: #ffedd5;
  }
  .schedule-lock-all-bar .btn-lock-toggle.is-locked {
    background: #ecfdf5;
    color: #1b6f64;
    border-color: #6ee7b7;
  }
  .schedule-lock-all-bar .btn-lock-toggle.is-locked:hover {
    background: #d1fae5;
  }

  .sched-table td.off {
    background: #f0f1f4;
    color: #6b7280;
  }

  .sched-table td.urlop {
    background: #e0f2fe;
    color: #0369a1;
    font-weight: 700;
  }

  .sched-table td.closed {
    background: #4b5563;
    color: #e5e7eb;
    font-style: italic;
    font-weight: 600;
  }

  .sched-table td.holiday {
    background: #fef3c7;
    color: #b45309;
    font-weight: 700;
  }

  .sched-table td.work {
    font-family: var(--mono);
    font-weight: 600;
    font-size: 11.5px;
    color: #1f2937;
    letter-spacing: -0.02em;
  }

  .sched-table td.weekend {
    background: #f3f4f6;
    color: #4b5563;
  }

  .sched-table td.weekend.work {
    background: #eef0f3;
    color: #1f2937;
  }

  .sched-table tr:has(td.weekend) td:first-child,
  .sched-table tr:has(td.weekend) td:nth-child(2) {
    background: #e5e7eb;
    color: #374151;
    font-weight: 700;
  }

  .sched-table td.editable-cell {
    cursor: pointer;
    position: relative;
    min-width: 96px;
  }

  .sched-table td.editable-cell:hover {
    outline: 2px solid var(--play-purple-mid);
    outline-offset: -2px;
    z-index: 1;
  }

  .sched-table td.editable-cell.locked-cell {
    box-shadow: inset 0 0 0 2px #b45309;
  }

  .sched-table td.editable-cell.locked-cell .cell-label::after {
    content: " 🔒";
    font-size: 9px;
  }

  #empTable th,
  #empTable td {
    padding: 7px 8px;
    vertical-align: middle;
  }

  #empTable tr.row-all td {
    background: var(--play-purple-light);
    font-weight: 700;
  }

  #empTable tr.row-all td:first-child {
    color: var(--play-purple-dark);
    font-size: 11.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  #empTable tr.row-all input[type=number] {
    background: #fff;
  }


  /* Live preview of narrow text inputs (employee labels) */
  #input-live-tip {
    display: none;
    position: fixed;
    z-index: 10001;
    max-width: min(420px, calc(100vw - 16px));
    padding: 8px 12px;
    background: #1f2937;
    color: #f9fafb;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: 0.01em;
    border-radius: 10px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.28);
    white-space: pre-wrap;
    word-break: break-word;
    pointer-events: none;
  }
  #input-live-tip.is-visible { display: block; }
  #input-live-tip.is-empty {
    color: #9ca3af;
    font-weight: 500;
    font-style: italic;
  }
  #input-live-tip .tip-arrow {
    position: absolute;
    width: 0;
    height: 0;
    border: 6px solid transparent;
  }
  #input-live-tip.tip-above .tip-arrow {
    left: var(--arrow-left, 50%);
    bottom: -12px;
    transform: translateX(-50%);
    border-top-color: #1f2937;
  }
  #input-live-tip.tip-below .tip-arrow {
    left: var(--arrow-left, 50%);
    top: -12px;
    transform: translateX(-50%);
    border-bottom-color: #1f2937;
  }

  #empTable td:first-child input[type=text] {
    text-align: left;
    font-weight: 600;
    min-width: 100px;
    width: 100%;
  }


  #empTable tbody tr:not(.row-all):hover td {
    background: #faf8fc;
  }

  #empTable th.drag-col,
  #empTable td.drag-col {
    width: 28px;
    min-width: 28px;
    max-width: 28px;
    padding: 4px 2px !important;
    border-right: none;
    user-select: none;
  }

  #empTable .drag-handle,
  #prefTable .col-drag-handle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 28px;
    border-radius: 6px;
    color: var(--muted);
    cursor: grab;
    font-size: 14px;
    line-height: 1;
    letter-spacing: -1px;
    touch-action: none;
    user-select: none;
  }

  #empTable .drag-handle:hover,
  #prefTable .col-drag-handle:hover {
    background: var(--play-purple-light);
    color: var(--play-purple-dark);
  }

  #empTable .drag-handle:active,
  #empTable tr.emp-dragging .drag-handle,
  #prefTable .col-drag-handle:active {
    cursor: grabbing;
  }

  #empTable tr.emp-dragging {
    opacity: 0.55;
  }

  #empTable tr.emp-drag-over > td {
    box-shadow: inset 0 2px 0 0 var(--play-purple);
  }

  #empTable tr.row-all td.drag-col {
    background: var(--play-purple-light);
  }

  #prefTable th.pref-col-th {
    position: relative;
    min-width: 118px;
    vertical-align: middle;
  }

  #prefTable th.pref-col-th .pref-col-head {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    max-width: 100%;
  }

  #prefTable th.pref-col-th .pref-col-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #prefTable th.pref-col-dragging {
    opacity: 0.45;
  }

  #prefTable th.pref-col-drag-over {
    box-shadow: inset 3px 0 0 0 var(--play-purple);
  }

  .match-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
    margin: 0 0 12px;
    padding: 10px 12px;
    background: var(--play-purple-light);
    border: 1px solid var(--play-purple-soft);
    border-radius: var(--radius-sm);
  }

  .match-bar-label {
    font-size: 12.5px;
    font-weight: 800;
    color: var(--play-purple-dark);
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  .match-bar select {
    width: auto;
    min-width: 110px;
    max-width: 160px;
    font-weight: 600;
  }

  .match-bar .match-sep {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
  }

  .btn-history {
    background: #fff;
    color: var(--play-purple-dark);
    border: 1px solid var(--play-purple-soft);
    font-size: 12.5px;
    font-weight: 700;
    padding: 8px 12px;
  }

  .btn-history:hover:not(:disabled) {
    background: var(--play-purple-soft);
  }

  .btn-history:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .generate-bar .btn-history {
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
    border: 1.5px solid rgba(255, 255, 255, 0.45);
    font-size: 13.5px;
    font-weight: 800;
    letter-spacing: 0.02em;
    padding: 11px 16px;
  }

  .generate-bar .btn-history:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.26);
    border-color: rgba(255, 255, 255, 0.7);
  }

  .generate-bar .btn-history:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }


  #prefTable tbody tr:not(.row-closed):not(.row-holiday):hover td {
    background: #faf8fc;
  }

  #prefTable select:focus {
    border-color: var(--play-purple-mid);
    box-shadow: var(--focus-ring);
  }

  /* Zebra for schedule day rows for easier scanning */
  .sched-table tbody tr:nth-child(even):not(.summary) td.work {
    background: #fafafa;
  }
  .sched-table tbody tr:nth-child(even):not(.summary) td.weekend.work {
    background: #ebecef;
  }

  .lock-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .btn-lock {
    font-weight: 700;
    font-size: 12.5px;
    border-radius: var(--radius-sm);
    padding: 9px 13px;
    cursor: pointer;
    background: #fff7ed;
    color: #9a3412;
    border: 1px solid #fdba74;
  }

  .btn-lock:hover { background: #ffedd5; }

  .sched-table td.editable-cell .cell-edit {
    display: none;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    font-size: 11px;
    padding: 0 3px;
    border: 2px solid var(--play-purple);
    border-radius: 0;
    background: #fff;
    z-index: 2;
  }

  .sched-table td.editable-cell.editing .cell-label { display: none; }
  .sched-table td.editable-cell.editing .cell-edit { display: block; }

  .sched-table tr.summary td {
    font-weight: 800;
    background: var(--play-purple-light);
    padding: 7px 6px;
    font-size: 12px;
  }

  .sched-table tr.summary td.ok { color: var(--good); }
  .sched-table tr.summary td.bad { color: var(--bad); }

  .sched-panel-header {
    flex-wrap: wrap;
    row-gap: 10px;
  }

  .sched-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink-soft);
  }

  .legend-swatch {
    width: 12px;
    height: 12px;
    border-radius: 4px;
    flex-shrink: 0;
    display: inline-block;
  }

  .swatch-work { background: #eef0f3; border: 1px solid var(--line-strong); }
  .swatch-off { background: #f0f1f4; border: 1px solid var(--line-strong); }
  .swatch-urlop { background: #e0f2fe; border: 1px solid #93c5e8; }
  .swatch-holiday { background: #fef3c7; border: 1px solid #f4d38b; }
  .swatch-closed { background: #4b5563; }
  .swatch-locked { background: #fff; box-shadow: inset 0 0 0 2px #b45309; }

  .prefcell {
    min-width: 118px;
    padding: 4px !important;
  }

  .prefcell select {
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 8px;
    width: 100%;
    min-width: 108px;
    text-align-last: center;
    border-radius: var(--radius-xs);
    border: 1px solid var(--line-strong);
    background: #fff;
    color: var(--ink);
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }

  /* Kolorowanie wg wybranej preferencji — szybkie skanowanie wzrokiem */
  .prefcell select.pv-empty {
    color: var(--muted);
    font-weight: 500;
    border-color: var(--line);
  }

  .prefcell select.pv-vacation {
    background: #e0f2fe;
    border-color: #93c5e8;
    color: #0369a1;
  }

  .prefcell select.pv-S1 { background: #f0ecf9; border-color: #d5c7ec; color: var(--play-purple-dark); }
  .prefcell select.pv-S2 { background: #e4dcf3; border-color: #c7b3e6; color: var(--play-purple-dark); }
  .prefcell select.pv-S3 { background: #d3c0ea; border-color: #b596dd; color: var(--play-purple-dark); }
  .prefcell select.pv-S4 { background: #b596dd; border-color: #9b6fd0; color: #fff; }
  .prefcell select.pv-S5 { background: var(--play-purple-mid); border-color: var(--play-purple-mid); color: #fff; }

  .prefcell select:hover { border-color: #c4b5d0; }

  .small {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
  }

  /* ——— Top bar ——— */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: var(--content-max);
    margin: 0 auto 14px;
    gap: 14px;
    flex-wrap: wrap;
    background: linear-gradient(135deg, #220040 0%, #48227d 45%, #6c43bf 100%);
    padding: 12px 18px;
    border-radius: var(--radius);
    box-shadow: 0 6px 20px rgba(34, 0, 64, 0.35);
  }

  .top-bar-save {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    justify-content: flex-end;
    min-width: 0;
  }

  /* ——— Help tips ——— */
  .help-tip {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    margin: 0;
    border-radius: 50%;
    background: var(--play-purple);
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    line-height: 1;
    cursor: help;
    flex-shrink: 0;
    vertical-align: middle;
    transition: background 0.12s ease, transform 0.12s ease;
  }

  .help-tip:hover,
  .help-tip:focus,
  #empTable th .help-tip:hover,
  #empTable th .help-tip:focus,
  #empTable tr.row-all td:first-child .help-tip:hover,
  #empTable tr.row-all td:first-child .help-tip:focus,
  .panel h2 .help-tip:hover,
  .panel h2 .help-tip:focus,
  .label-with-tip .help-tip:hover,
  .label-with-tip .help-tip:focus,
  .th-with-tip .help-tip:hover,
  .th-with-tip .help-tip:focus,
  .sched-legend .help-tip:hover,
  .sched-legend .help-tip:focus,
  .match-bar .help-tip:hover,
  .match-bar .help-tip:focus {
    background: var(--play-purple-dark) !important;
    color: #fff !important;
    transform: scale(1.08);
  }

  /* Wrapper: label + ? always on one visual line, tip vertically centered */
  .th-with-tip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-wrap: nowrap;
    line-height: 1.25;
  }

  .has-tip { /* marker for JS tooltips on buttons/cells */ }

  #app-tooltip {
    display: none;
    position: fixed;
    z-index: 10000;
    max-width: min(300px, calc(100vw - 16px));
    padding: 9px 12px;
    background: #1f2937;
    color: #f9fafb;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.45;
    text-align: left;
    border-radius: 10px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.28);
    white-space: normal;
    pointer-events: none;
  }

  #app-tooltip.is-visible {
    display: block;
  }

  #app-tooltip .tip-arrow {
    position: absolute;
    width: 0;
    height: 0;
    border: 6px solid transparent;
  }

  #app-tooltip.tip-above .tip-arrow {
    left: var(--arrow-left, 50%);
    bottom: -12px;
    transform: translateX(-50%);
    border-top-color: #1f2937;
  }

  #app-tooltip.tip-below .tip-arrow {
    left: var(--arrow-left, 50%);
    top: -12px;
    transform: translateX(-50%);
    border-bottom-color: #1f2937;
  }

  /* Employee table headers: stack label text if needed, tip stays top-right of the block */
  #empTable th .th-with-tip {
    display: inline-flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 5px;
    max-width: 100%;
  }

  #empTable th .th-with-tip .tip-label {
    display: block;
    line-height: 1.2;
  }

  #empTable th .help-tip {
    background: var(--play-purple);
    margin: 0;
    align-self: center;
  }

  #empTable tr.row-all td:first-child .th-with-tip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  #empTable tr.row-all td:first-child .help-tip {
    background: var(--play-purple);
  }

  /* Inline labels outside tables (Święta, section titles) */
  .label-with-tip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-wrap: nowrap;
  }

  .panel h2 .help-tip,
  .label-with-tip .help-tip {
    margin: 0;
  }

  #sundaysBox {
    padding: 4px 0;
  }

  #sundaysBox label {
    margin-right: 12px;
    margin-bottom: 6px;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--ink-soft);
    font-weight: 500;
  }

  #sundaysBox input[type=checkbox] {
    accent-color: var(--play-purple);
  }

  #prefTable th {
    font-size: 11.5px;
    padding: 8px 6px;
  }

  #prefTable td {
    padding: 5px 6px;
  }

  #prefTable tr.row-holiday td { background: #fffbeb; }

  #prefTable tr.row-holiday td:first-child,
  #prefTable tr.row-holiday td:nth-child(2) {
    background: #fef3c7;
    color: #b45309;
    font-weight: 700;
  }

  #prefTable tr.row-closed td {
    background: #f9fafb;
    color: #9ca3af;
  }

  .holidays-input-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .holidays-input-wrap input[type=text] {
    width: 100%;
    max-width: 340px;
    font-size: 13px;
    padding: 8px 10px;
  }

  @media (hover: hover) {
    .panel:hover {
      border-color: var(--play-purple-soft);
      box-shadow: var(--shadow-lg);
    }
  }

  /* ——— Readable scrollbars for tables ——— */
  #view-employee-prefs .panel > div[style*="overflow"],
  #output .panel > div[style*="overflow"] {
    border-radius: 8px;
  }

  /* ——— Slightly larger touch targets on mobile ——— */
  @media (max-width: 640px) {
    body {
      padding: 10px 8px 28px;
      font-size: 13.5px;
    }
    .top-bar {
      padding: 10px 12px;
      gap: 10px;
    }
    .top-bar-logo { height: 36px; }
    h1 { font-size: 14px; }
    .view-switch button {
      padding: 9px 12px;
      font-size: 12px;
    }
    .panel {
      padding: 14px;
    }
    input[type=text],
    input[type=number],
    select {
      font-size: 14px; /* prevents iOS zoom */
      padding: 8px 10px;
    }
  }
</style>
</head>

<script>
'use strict';

const SHIFTS = {
  S1: { label: '8:30–16:30', start: 8.5, end: 16.5, role: 'open' },
  S2: { label: '10:00–18:00', start: 10, end: 18, role: 'mid' },
  S3: { label: '11:00–19:00', start: 11, end: 19, role: 'mid' },
  S4: { label: '12:00–20:00', start: 12, end: 20, role: 'mid' },
  S5: { label: '13:00–21:00', start: 13, end: 21, role: 'close' },
};

const SHIFT_CODES = Object.keys(SHIFTS);
const SHIFT_ORDER = ['S1', 'S2', 'S3', 'S4', 'S5'];
const shiftIndex = code => { const i = SHIFT_ORDER.indexOf(code); return i === -1 ? 2 : i; };
const shiftDist = (a, b) => (!a || !b) ? 99 : Math.abs(shiftIndex(a) - shiftIndex(b));
/** Po S5 następny dzień nie wcześniej niż S3; inaczej max ±1 w SHIFT_ORDER. */
function shiftAllowedAfter(prev, next) {
  if (!prev || !next) return true;
  return prev === 'S5' ? shiftIndex(next) >= shiftIndex('S3') : shiftDist(prev, next) <= 1;
}
/** Max skoków godziny (±1) w ramach JEDNEJ serii kolejnych dni pracy (po wolnym licznik od zera). */
const MAX_JUMPS_PER_SERIES = 1;

/**
 * Wybór zmiany z silną ciągłością w serii:
 * - ta sama co wczoraj (preferowane),
 * - ±1 tylko gdy brak slotu tej samej i w tej serii jeszcze niewykorzystany skok (max 1),
 * - awaryjnie najbliższa dostępna (domknięcie dnia).
 */
function pickContinuousShift(remainingPlan, shiftCount, last, e, shiftJumps, forceJump) {
  const jumps = shiftJumps || {};
  const jumpsUsed = jumps[e.id] || 0;
  const canJump = forceJump || jumpsUsed < MAX_JUMPS_PER_SERIES;
  const studentAllows = (code) => {
    if (!isStudentEmp(e)) return true;
    if (code !== 'S1' && code !== 'S5') return true;
    return (shiftCount[code] || 0) >= 1;
  };
  const ok = (c) => studentAllows(c) && (shiftCount[c] || 0) < 2;

  if (last) {
    let sameIdx = remainingPlan.findIndex(c => c === last && ok(c));
    if (sameIdx !== -1) return sameIdx;
    sameIdx = remainingPlan.findIndex(c => c === last && studentAllows(c));
    if (sameIdx !== -1) return sameIdx;

    if (canJump) {
      let bestIdx = -1, bestD = 99, bestC = 99;
      remainingPlan.forEach((c, i) => {
        if (!ok(c) || !shiftAllowedAfter(last, c)) return;
        const d = shiftDist(c, last);
        const cnt = shiftCount[c] || 0;
        if (d < bestD || (d === bestD && cnt < bestC)) {
          bestD = d; bestC = cnt; bestIdx = i;
        }
      });
      if (bestIdx !== -1) return bestIdx;
    }
    // Brak legalnej opcji — wołający wymusi last (nigdy S5→S1)
    return -1;
  }

  return remainingPlan.findIndex(c => ok(c));
}
const calendarDayDiff = (a, b) => Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00')) / 86400000);
const DAY_NAMES = ['nd', 'pon', 'wt', 'śr', 'czw', 'pt', 'sob'];
const MONTH_NAMES = [
  'Styczeń', 'Luty', 'Marzec', 'Kwiecień', 'Maj', 'Czerwiec',
  'Lipiec', 'Sierpień', 'Wrzesień', 'Październik', 'Listopad', 'Grudzień'
];

const MIN_STAFF = 3;
const MIN_STAFF_SATURDAY = 4;
const MAX_CONSECUTIVE_DAYS = 5;
const MAX_CONSECUTIVE_DAYS_EXTENDED = 6;
const HOURS_PER_DAY = 8;

/** Max dni pracy pod rząd (5 domyślnie, 6 przy allowSixConsecutive). */
function maxConsecForEmp(empOrId) {
  const e = typeof empOrId === 'object' && empOrId
    ? empOrId
    : state.employees.find(x => x.id === empOrId);
  return e?.allowSixConsecutive ? MAX_CONSECUTIVE_DAYS_EXTENDED : MAX_CONSECUTIVE_DAYS;
}

const minStaffForDay = day => day.dow === 6 ? MIN_STAFF_SATURDAY : MIN_STAFF;

const DEFAULT_EMPLOYEE_NAMES = ['M.P.', 'J.D.', 'K.P.', 'A.M.', 'U.F.', 'S.S.'];
const DEFAULT_EMPLOYEES = DEFAULT_EMPLOYEE_NAMES.map((name, i) => ({
  id: 'e' + (i + 1),
  name,
  target: 160,
  allowSixConsecutive: false,
  preferFreeOverUrlop: true,
  isStudent: false,
}));

/**
 * Uczeń: nie liczy się do minimalnej obsady dnia;
 * otwarcie (S1) / zamknięcie (S5) tylko gdy ktoś inny jest na tej samej zmianie.
 */
const isStudentEmp = e => !!(e && e.isStudent);

const state = {
  employees: [],
  curYear: null,
  curMonth: null,
  tradingSundays: new Set(),
  holidays: new Set(),
  prefs: {},
  lastSchedule: null,
  lockedCells: {},
};

const uid = () => 'e' + Math.random().toString(36).slice(2, 9);

function createEmployee(overrides = {}) {
  return {
    id: uid(),
    name: 'Nowy',
    target: 160,
    allowSixConsecutive: false,
    preferFreeOverUrlop: true,
    isStudent: false,
    ...overrides,
  };
}


const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const daysInMonth = (y, m) => new Date(y, m, 0).getDate();
const dateStr = (y, m, d) => `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

function storageGet(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch { return fallback; }
}
function storageSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* ignore */ }
}
const monthSettingsKey = () => `settings:${state.curYear}-${state.curMonth}`;
const scheduleKey = () => `schedule:${state.curYear}-${state.curMonth}`;
const getPref = (ds, empId) => state.prefs[`${ds}|${empId}`];

const isHardOff = pref => pref && (pref.type === 'off' || pref.type === 'vacation');
const isWorkingVal = val => val && val !== 'Wolne' && val !== 'Urlop';
const PREF_VISUAL_CLASSES = ['pv-empty', 'pv-vacation', 'pv-S1', 'pv-S2', 'pv-S3', 'pv-S4', 'pv-S5'];
function prefVisualClass(prefOrValue) {
  if (!prefOrValue) return 'pv-empty';
  if (typeof prefOrValue === 'string') {
    if (prefOrValue === 'vacation' || prefOrValue === 'off') return 'pv-vacation';
    return SHIFT_CODES.includes(prefOrValue) ? `pv-${prefOrValue}` : 'pv-empty';
  }
  if (prefOrValue.type === 'vacation' || prefOrValue.type === 'off') return 'pv-vacation';
  if (prefOrValue.type === 'shift' && prefOrValue.code) return `pv-${prefOrValue.code}`;
  return 'pv-empty';
}
function applyPrefVisual(el, value) {
  el.classList.remove(...PREF_VISUAL_CLASSES);
  el.classList.add(prefVisualClass(value || null));
}
function countWorkedDays(empId, openDays, schedule) {
  return openDays.filter(d => !d.closed && isWorkingVal(schedule[d.ds]?.[empId])).length;
}
const countUrlopDays = (empId, openDays, schedule) =>
  openDays.filter(d => schedule[d.ds]?.[empId] === 'Urlop').length;
const etatDays = (empId, openDays, schedule) =>
  countWorkedDays(empId, openDays, schedule) + countUrlopDays(empId, openDays, schedule);
const totalHours = (emp, openDays, schedule, actualUrlop) =>
  (countWorkedDays(emp.id, openDays, schedule) + (actualUrlop[emp.id] || 0)) * HOURS_PER_DAY;

function getShiftPlan(n) {
  if (n <= 0) return [];
  const plans = {
    1:['S1'], 2:['S1','S5'], 3:['S1','S3','S5'], 4:['S1','S3','S4','S5'],
    5:['S1','S2','S3','S4','S5'], 6:['S1','S2','S3','S3','S4','S5'],
    7:['S1','S2','S2','S3','S3','S4','S5'], 8:['S1','S2','S2','S3','S3','S4','S4','S5'],
  };
  if (plans[n]) return plans[n];
  return ['S1','S2','S2','S3','S3','S4','S4','S5','S5'].slice(0, Math.min(n, 9));
}

function loadEmployees() {
  state.employees = storageGet('employees', null) || DEFAULT_EMPLOYEES.map(e => ({ ...e }));
  for (const e of state.employees) {
    if (e.allowSixConsecutive === undefined) e.allowSixConsecutive = false;
    if ('preferFreeSaturdays' in e) delete e.preferFreeSaturdays;
    if (e.preferFreeOverUrlop === undefined) e.preferFreeOverUrlop = true;
    if (e.isStudent === undefined) e.isStudent = false;
    delete e.daysOff;
  }
  renderEmployeeTable();
}
const saveEmployees = () => storageSet('employees', state.employees);

const saveMonthSettings = () => storageSet(monthSettingsKey(), {
  tradingSundays: [...state.tradingSundays],
  holidays: [...state.holidays],
  prefs: state.prefs,
});
function loadMonthSettings() {
  const data = storageGet(monthSettingsKey(), { tradingSundays: [], holidays: [], prefs: {} });
  state.tradingSundays = new Set(data.tradingSundays || []);
  state.holidays = new Set(data.holidays || []);
  state.prefs = data.prefs || {};
}

const isDayClosed = (ds, dow) => state.holidays.has(ds) || (dow === 0 && !state.tradingSundays.has(ds));

const lockKey = (ds, empId) => `${ds}|${empId}`;
const isCellLocked = (ds, empId) => !!state.lockedCells[lockKey(ds, empId)];
function setCellLocked(ds, empId, locked) {
  const k = lockKey(ds, empId);
  if (locked) state.lockedCells[k] = true; else delete state.lockedCells[k];
}
const hasAnyLockedCells = () => Object.keys(state.lockedCells || {}).length > 0;

function updateLockToggleButton() {
  const btn = document.getElementById('lockToggleBtn');
  if (!btn) return;
  const locked = hasAnyLockedCells();
  if (locked) {
    btn.textContent = '🔓 ODBLOKUJ WSZYSTKIE';
    btn.setAttribute('data-tip', 'Odblokuj wszystkie pola');
    btn.classList.add('is-locked');
  } else {
    btn.textContent = '🔒 ZABLOKUJ WSZYSTKIE';
    btn.setAttribute('data-tip', 'Zablokuj wszystkie pola - opcja GENERUJ GRAFIK ich nie zmieni');
    btn.classList.remove('is-locked');
  }
}

function lockAllScheduleCells() {
  const ls = state.lastSchedule;
  if (!ls?.schedule || !ls?.openDays) return;
  for (const day of ls.openDays) {
    if (day.closed) continue;
    for (const e of state.employees) {
      const val = ls.schedule[day.ds]?.[e.id];
      if (val != null) setCellLocked(day.ds, e.id, true);
    }
  }
  saveCurrentSchedule();
  refreshAfterManualEdit();
  updateLockToggleButton();
}
function unlockAllScheduleCells() {
  if (!Object.keys(state.lockedCells || {}).length) return;
  state.lockedCells = {};
  saveCurrentSchedule();
  if (state.lastSchedule) refreshAfterManualEdit();
  updateLockToggleButton();
}
const toggleLockAllScheduleCells = () => hasAnyLockedCells() ? unlockAllScheduleCells() : lockAllScheduleCells();

/** Czy wszystkie otwarte dni pracownika są zablokowane. */
function isEmployeeScheduleFullyLocked(empId) {
  const ls = state.lastSchedule;
  if (!ls?.openDays || !ls?.schedule) return false;
  const days = ls.openDays.filter(d => !d.closed);
  if (!days.length) return false;
  return days.every(d => isCellLocked(d.ds, empId));
}

function lockEmployeeSchedule(empId) {
  const ls = state.lastSchedule;
  if (!ls?.schedule || !ls?.openDays || !empId) return;
  pushScheduleHistory();
  let changed = 0;
  for (const day of ls.openDays) {
    if (day.closed) continue;
    const val = ls.schedule[day.ds]?.[empId];
    if (val == null) continue;
    if (!isCellLocked(day.ds, empId)) {
      setCellLocked(day.ds, empId, true);
      changed++;
    }
  }
  if (!changed) {
    scheduleHistory.undo.pop();
    updateHistoryButtons();
    return;
  }
  refreshAfterManualEdit();
  updateLockToggleButton();
}

function unlockEmployeeSchedule(empId) {
  const ls = state.lastSchedule;
  if (!ls?.openDays || !empId) return;
  pushScheduleHistory();
  let changed = 0;
  for (const day of ls.openDays) {
    if (day.closed) continue;
    if (isCellLocked(day.ds, empId)) {
      setCellLocked(day.ds, empId, false);
      changed++;
    }
  }
  if (!changed) {
    scheduleHistory.undo.pop();
    updateHistoryButtons();
    return;
  }
  refreshAfterManualEdit();
  updateLockToggleButton();
}

const toggleEmployeeScheduleLock = (empId) =>
  isEmployeeScheduleFullyLocked(empId)
    ? unlockEmployeeSchedule(empId)
    : lockEmployeeSchedule(empId);

/** Czy wszystkie komórki otwartego dnia (wszyscy pracownicy) są zablokowane. */
function isDayScheduleFullyLocked(ds) {
  const ls = state.lastSchedule;
  if (!ls?.schedule?.[ds] || !state.employees?.length) return false;
  const day = ls.openDays?.find(d => d.ds === ds);
  if (!day || day.closed) return false;
  return state.employees.every(e => {
    const val = ls.schedule[ds]?.[e.id];
    if (val == null) return true;
    return isCellLocked(ds, e.id);
  });
}

function lockDaySchedule(ds) {
  const ls = state.lastSchedule;
  if (!ls?.schedule?.[ds] || !state.employees?.length) return;
  const day = ls.openDays?.find(d => d.ds === ds);
  if (!day || day.closed) return;
  pushScheduleHistory();
  let changed = 0;
  for (const e of state.employees) {
    const val = ls.schedule[ds]?.[e.id];
    if (val == null) continue;
    if (!isCellLocked(ds, e.id)) {
      setCellLocked(ds, e.id, true);
      changed++;
    }
  }
  if (!changed) {
    scheduleHistory.undo.pop();
    updateHistoryButtons();
    return;
  }
  refreshAfterManualEdit();
  updateLockToggleButton();
}

function unlockDaySchedule(ds) {
  const ls = state.lastSchedule;
  if (!ls?.schedule?.[ds] || !state.employees?.length) return;
  const day = ls.openDays?.find(d => d.ds === ds);
  if (!day || day.closed) return;
  pushScheduleHistory();
  let changed = 0;
  for (const e of state.employees) {
    if (isCellLocked(ds, e.id)) {
      setCellLocked(ds, e.id, false);
      changed++;
    }
  }
  if (!changed) {
    scheduleHistory.undo.pop();
    updateHistoryButtons();
    return;
  }
  refreshAfterManualEdit();
  updateLockToggleButton();
}

const toggleDayScheduleLock = (ds) =>
  isDayScheduleFullyLocked(ds) ? unlockDaySchedule(ds) : lockDaySchedule(ds);

function applyLockedCellsToSchedule(schedule, openDays, employees) {
  for (const day of openDays) {
    if (day.closed) continue;
    if (!schedule[day.ds]) schedule[day.ds] = {};
    for (const e of employees) {
      const k = lockKey(day.ds, e.id);
      if (!state.lockedCells[k]) continue;
      // Przywróć wartość z poprzedniego grafiku, jeśli dostępna
      const prev = state.lastSchedule?.schedule?.[day.ds]?.[e.id];
      if (prev != null) schedule[day.ds][e.id] = prev;
    }
  }
}

function saveCurrentSchedule() {
  if (!state.lastSchedule || !state.curYear || !state.curMonth) return;
  state.lastSchedule.lockedCells = { ...state.lockedCells };
  storageSet(scheduleKey(), state.lastSchedule);
}

function loadCurrentSchedule() {
  const data = storageGet(scheduleKey(), null);
  if (!data) return false;
  state.lastSchedule = data;
  state.lockedCells = data.lockedCells ? { ...data.lockedCells } : {};
  clearScheduleHistory();
  if (!data.roleCounts && data.openDays && data.schedule) {
    data.roleCounts = computeRoleCounts(state.employees, data.openDays, data.schedule);
  }
  if (!data.freeSaturdays && data.openDays && data.schedule) {
    data.freeSaturdays = computeFreeSaturdays(state.employees, data.openDays, data.schedule);
  }
  renderWarnings(data.warnings || [], data.softWarnings || []);
  renderOutput(
    data.openDays,
    data.schedule,
    data.requiredOff,
    data.actualWolne,
    data.actualUrlop,
    data.roleCounts,
    data.freeSaturdays
  );
  updateLockToggleButton();
  return true;
}

const saveLastMonthYear = () => storageSet('ui:lastMonthYear', { year: state.curYear, month: state.curMonth });

function saveAllData() {
  // Upewnij się, że stan miesiąca/roku = to co na liście
  state.curMonth = Number(document.getElementById('monthSel').value);
  state.curYear = Number(document.getElementById('yearSel').value);
  saveLastMonthYear();
  saveEmployees();
  saveMonthSettings();
  saveCurrentSchedule();

  const btn = document.getElementById('saveBtn');
  const original = btn.innerText;
  btn.innerText = '✔️ ZAPISANO!';
  btn.style.background = '#ecfdf5';
  btn.style.color = 'var(--good)';
  setTimeout(() => {
    btn.innerText = original;
    btn.style.background = '';
    btn.style.color = '';
  }, 2000);
}

function consensusValue(getter) {
  if (!state.employees.length) return { value: '', mixed: false };
  const value = getter(state.employees[0]);
  return { value, mixed: state.employees.some(e => getter(e) !== value) };
}

function renderEmployeeTable() {
  const tbody = document.querySelector('#empTable tbody');

  const hoursC = consensusValue(e => e.target);
  const sixC = consensusValue(e => !!e.allowSixConsecutive);
  const urlopC = consensusValue(e => e.preferFreeOverUrlop !== false);

  const allRow = `
    <tr class="row-all">
      <td class="drag-col"></td>
      <td>
        <span class="th-with-tip"><span class="tip-label">Wszyscy</span><span class="help-tip" tabindex="0" data-tip="Zmiany w tym wierszu zmieniają opcje u wszystkich pracowników.">?</span></span>
      </td>
      <td>
        <input type="number" min="0" step="8"
          value="${hoursC.mixed ? '' : esc(hoursC.value)}"
          placeholder="${hoursC.mixed ? 'różne' : ''}"
          data-emp="__all__" data-field="target">
      </td>
      <td>
        <input type="checkbox" ${!sixC.mixed && sixC.value ? 'checked' : ''}
          data-emp="__all__" data-field="allowSixConsecutive"
          data-mixed="${sixC.mixed ? '1' : '0'}">
      </td>
      <td>
        <input type="checkbox" ${!urlopC.mixed && urlopC.value ? 'checked' : ''}
          data-emp="__all__" data-field="preferFreeOverUrlop"
          data-mixed="${urlopC.mixed ? '1' : '0'}">
      </td>
      <td></td>
      <td></td>
    </tr>`;

  const empRows = state.employees.map(emp => `
    <tr class="emp-row" data-emp-id="${emp.id}">
      <td class="drag-col">
        <span class="drag-handle has-tip" data-tip="Przeciągnij, aby zmienić kolejność" draggable="true" data-emp-id="${emp.id}" aria-label="Przeciągnij">⋮⋮</span>
      </td>
      <td><input type="text" value="${esc(emp.name)}" data-emp="${emp.id}" data-field="name"></td>
      <td><input type="number" value="${emp.target}" min="0" step="8" data-emp="${emp.id}" data-field="target"></td>
      <td>
        <input type="checkbox" ${emp.allowSixConsecutive ? 'checked' : ''}
          data-emp="${emp.id}" data-field="allowSixConsecutive">
      </td>
      <td>
        <input type="checkbox" ${emp.preferFreeOverUrlop !== false ? 'checked' : ''}
          data-emp="${emp.id}" data-field="preferFreeOverUrlop">
      </td>
      <td>
        <input type="checkbox" ${emp.isStudent ? 'checked' : ''}
          data-emp="${emp.id}" data-field="isStudent">
      </td>
      <td><button class="btn-ghost" data-action="remove-employee" data-emp="${emp.id}">usuń</button></td>
    </tr>`).join('');

  tbody.innerHTML = allRow + empRows;

  // Indeterminate dla checkboxów gdy wartości się różnią
  tbody.querySelectorAll('tr.row-all input[type=checkbox][data-mixed="1"]').forEach(cb => {
    cb.indeterminate = true;
  });
  initEmpTableDragDrop();
}

function applyEmpField(emp, field, value) {
  if (field === 'target') {
    const n = Number(value);
    if (!Number.isFinite(n) || n < 0) return;
    emp.target = n;
  } else if (field === 'allowSixConsecutive') {
    emp.allowSixConsecutive = !!value;
  } else if (field === 'preferFreeOverUrlop') {
    emp.preferFreeOverUrlop = !!value;
  } else if (field === 'isStudent') {
    emp.isStudent = !!value;
  } else if (field === 'name') {
    emp.name = value;
  }
}

function updateEmp(id, field, value) {
  if (id === '__all__') {
    if (field === 'name') return;
    state.employees.forEach(e => applyEmpField(e, field, value));
    saveEmployees();
    renderEmployeeTable();
    renderPrefTable();
    return;
  }

  const emp = state.employees.find(e => e.id === id);
  if (!emp) return;

  applyEmpField(emp, field, value);
  saveEmployees();
  // Nie przebudowuj tabeli przy edycji pojedynczej osoby (focus w polach number).
  // Wiersz WSZYSCY odświeży consensus przy kolejnym pełnym renderze.
  if (field === 'name') renderPrefTable();
}

function addEmployee() {
  state.employees.push(createEmployee());
  saveEmployees(); renderEmployeeTable(); renderPrefTable();
}
function removeEmployee(id) {
  state.employees = state.employees.filter(e => e.id !== id);
  saveEmployees(); renderEmployeeTable(); renderPrefTable();
}

function reorderEmployee(fromId, toId) {
  if (!fromId || !toId || fromId === toId) return;
  const fromIdx = state.employees.findIndex(e => e.id === fromId);
  const toIdx = state.employees.findIndex(e => e.id === toId);
  if (fromIdx < 0 || toIdx < 0) return;
  const [item] = state.employees.splice(fromIdx, 1);
  state.employees.splice(toIdx, 0, item);
  saveEmployees();
  renderEmployeeTable();
  renderPrefTable();
  if (state.lastSchedule) refreshAfterManualEdit();
}

function initEmpTableDragDrop() {
  const tbody = document.querySelector('#empTable tbody');
  if (!tbody || tbody.dataset.dndBound === '1') return;
  tbody.dataset.dndBound = '1';

  let dragEmpId = null;

  tbody.addEventListener('dragstart', ev => {
    const handle = ev.target.closest('.drag-handle');
    if (!handle) { ev.preventDefault(); return; }
    dragEmpId = handle.dataset.empId || null;
    if (!dragEmpId) { ev.preventDefault(); return; }
    const row = handle.closest('tr.emp-row');
    if (row) row.classList.add('emp-dragging');
    ev.dataTransfer.effectAllowed = 'move';
    try { ev.dataTransfer.setData('text/plain', dragEmpId); } catch (_) {}
  });

  tbody.addEventListener('dragend', () => {
    tbody.querySelectorAll('tr.emp-dragging, tr.emp-drag-over').forEach(r => {
      r.classList.remove('emp-dragging', 'emp-drag-over');
    });
    dragEmpId = null;
  });

  tbody.addEventListener('dragover', ev => {
    const row = ev.target.closest('tr.emp-row');
    if (!row || !dragEmpId) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = 'move';
    tbody.querySelectorAll('tr.emp-drag-over').forEach(r => {
      if (r !== row) r.classList.remove('emp-drag-over');
    });
    if (row.dataset.empId !== dragEmpId) row.classList.add('emp-drag-over');
  });

  tbody.addEventListener('dragleave', ev => {
    const row = ev.target.closest('tr.emp-row');
    if (!row) return;
    const rel = ev.relatedTarget;
    if (rel && row.contains(rel)) return;
    row.classList.remove('emp-drag-over');

  tbody.addEventListener('drop', ev => {
    const row = ev.target.closest('tr.emp-row');
    if (!row) return;
    ev.preventDefault();
    const toId = row.dataset.empId;
    let fromId = dragEmpId;
    if (!fromId) {
      try { fromId = ev.dataTransfer.getData('text/plain'); } catch (_) {}
    }
    tbody.querySelectorAll('tr.emp-dragging, tr.emp-drag-over').forEach(r => {
      r.classList.remove('emp-dragging', 'emp-drag-over');
    });
    if (fromId && toId) reorderEmployee(fromId, toId);
    dragEmpId = null;
  });
}

/** Historia zmian na zakładce GENERATOR (cofnij / ponów). */
const scheduleHistory = {
  undo: [],
  redo: [],
  max: 40,
  applying: false,
};

function cloneScheduleSnapshot() {
  const ls = state.lastSchedule;
  if (!ls?.schedule) return null;
  // Głęboka kopia schedule + lockedCells
  const schedule = {};
  for (const ds of Object.keys(ls.schedule)) {
    schedule[ds] = { ...ls.schedule[ds] };
  }
  return {
    schedule,
    lockedCells: { ...state.lockedCells },
  };
}

function pushScheduleHistory() {
  if (scheduleHistory.applying) return;
  const snap = cloneScheduleSnapshot();
  if (!snap) return;
  scheduleHistory.undo.push(snap);
  if (scheduleHistory.undo.length > scheduleHistory.max) {
    scheduleHistory.undo.shift();
  }
  scheduleHistory.redo = [];
  updateHistoryButtons();
}

function applyScheduleSnapshot(snap) {
  if (!snap || !state.lastSchedule) return;
  scheduleHistory.applying = true;
  try {
    const schedule = {};
    for (const ds of Object.keys(snap.schedule)) {
      schedule[ds] = { ...snap.schedule[ds] };
    }
    state.lastSchedule.schedule = schedule;
    state.lockedCells = { ...snap.lockedCells };
    refreshAfterManualEdit();
  } finally {
    scheduleHistory.applying = false;
  }
  updateHistoryButtons();
}

function undoScheduleChange() {
  if (!scheduleHistory.undo.length || !state.lastSchedule) return;
  const current = cloneScheduleSnapshot();
  const prev = scheduleHistory.undo.pop();
  if (current) scheduleHistory.redo.push(current);
  applyScheduleSnapshot(prev);
}

function redoScheduleChange() {
  if (!scheduleHistory.redo.length || !state.lastSchedule) return;
  const current = cloneScheduleSnapshot();
  const next = scheduleHistory.redo.pop();
  if (current) scheduleHistory.undo.push(current);
  applyScheduleSnapshot(next);
}

function clearScheduleHistory() {
  scheduleHistory.undo = [];
  scheduleHistory.redo = [];
  updateHistoryButtons();
}

function updateHistoryButtons() {
  const undoBtn = document.getElementById('undoScheduleBtn');
  const redoBtn = document.getElementById('redoScheduleBtn');
  if (undoBtn) undoBtn.disabled = scheduleHistory.undo.length === 0;
  if (redoBtn) redoBtn.disabled = scheduleHistory.redo.length === 0;
}

/** Dokładne skopiowanie grafiku źródłowego pracownika na docelowego (otwarte dni). */
function matchScheduleFromTo(targetId, sourceId) {
  if (!state.lastSchedule?.schedule || !targetId || !sourceId || targetId === sourceId) return false;
  pushScheduleHistory();
  const { openDays, schedule } = state.lastSchedule;
  let changed = 0;
  for (const day of openDays) {
    if (day.closed) continue;
    if (!schedule[day.ds]) continue;
    // Nie nadpisuj już zablokowanych komórek u docelowego pracownika
    if (isCellLocked(day.ds, targetId)) continue;
    const srcVal = schedule[day.ds][sourceId];
    if (srcVal == null) continue;
    schedule[day.ds][targetId] = srcVal;
    // Nie blokuj skopiowanych komórek — respektowane są tylko wcześniejsze blokady
    changed++;
  }
  if (changed) refreshAfterManualEdit();
  else {
    // Nic nie zmieniono — wycofaj pusty wpis historii
    scheduleHistory.undo.pop();
    updateHistoryButtons();
  }
  return changed > 0;
}

function initMonthPickers() {
  const now = new Date();
  const monthSel = document.getElementById('monthSel');
  const yearSel = document.getElementById('yearSel');

  MONTH_NAMES.forEach((name, i) => monthSel.add(new Option(name, i + 1)));

  const thisYear = now.getFullYear();
  for (let y = thisYear - 1; y <= thisYear + 2; y++) {
    yearSel.add(new Option(y, y));
  }

  // Przywróć ostatnio wybrany miesiąc/rok (zapis przy „Zapisz” i przy zmianie miesiąca)
  const saved = storageGet('ui:lastMonthYear', null);
  if (saved && saved.year && saved.month) {
    state.curYear = Number(saved.year);
    state.curMonth = Number(saved.month);
    // Upewnij się, że rok jest na liście
    if (![...yearSel.options].some(o => Number(o.value) === state.curYear)) {
      yearSel.add(new Option(state.curYear, state.curYear));
    }
  } else {
    state.curMonth = now.getMonth() + 1;
    state.curYear = thisYear;
  }
  monthSel.value = state.curMonth;
  yearSel.value = state.curYear;
}

function renderSundaysBox() {
  const box = document.getElementById('sundaysBox');
  const nd = daysInMonth(state.curYear, state.curMonth);
  const sundays = [];

  for (let d = 1; d <= nd; d++) {
    if (new Date(state.curYear, state.curMonth - 1, d).getDay() === 0) {
      sundays.push(d);
    }
  }

  if (sundays.length === 0) {
    box.innerHTML = 'Brak niedziel w tym miesiącu.';
    return;
  }

  box.innerHTML =
    '<div style="margin-bottom:8px;font-weight:700;color:var(--play-purple);font-size:12.5px;letter-spacing:0.02em;">Niedziele handlowe</div>' +
    sundays.map(d => {
      const ds = dateStr(state.curYear, state.curMonth, d);
      const checked = state.tradingSundays.has(ds) ? 'checked' : '';
      return `<label style="margin-right:12px;">
        <input type="checkbox" ${checked} data-action="toggle-sunday" data-date="${ds}">
        ${d} ${MONTH_NAMES[state.curMonth - 1]}
      </label>`;

function toggleSunday(ds, checked) {
  if (checked) state.tradingSundays.add(ds); else state.tradingSundays.delete(ds);
  saveMonthSettings();
  renderPrefTable();
}

function holidaysToInputValue() {
  if (!state.curYear || !state.curMonth) return '';
  const days = [];
  for (const ds of state.holidays) {
    // ds = YYYY-MM-DD
    if (ds.startsWith(`${state.curYear}-${String(state.curMonth).padStart(2, '0')}-`)) {
      days.push(Number(ds.slice(-2)));
    }
  }
  return days.sort((a, b) => a - b).join(', ');
}

function renderHolidaysBox() {
  const input = document.getElementById('holidaysInput');
  const hint = document.getElementById('holidaysHint');
  if (!input || !hint) return;

  if (!state.curYear || !state.curMonth) {
    input.value = '';
    hint.textContent = '';
    return;
  }

  // Nie nadpisuj wartości, gdy użytkownik właśnie pisze (focus)
  if (document.activeElement !== input) {
    input.value = holidaysToInputValue();
  }

  const nd = daysInMonth(state.curYear, state.curMonth);
  const count = [...state.holidays].filter(ds =>
    ds.startsWith(`${state.curYear}-${String(state.curMonth).padStart(2, '0')}-`)
  ).length;
  hint.textContent = count
    ? `Ustawiono ${count} ${count === 1 ? 'święto' : count < 5 ? 'święta' : 'świąt'} w tym miesiącu (max ${nd} dni).`
    : '';
}

function applyHolidaysFromInput(raw) {
  if (!state.curYear || !state.curMonth) return;

  const nd = daysInMonth(state.curYear, state.curMonth);
  const prefix = `${state.curYear}-${String(state.curMonth).padStart(2, '0')}-`;

  // Usuń święta tylko z bieżącego miesiąca
  for (const ds of [...state.holidays]) {
    if (ds.startsWith(prefix)) state.holidays.delete(ds);
  }

  const parts = String(raw || '')
    .split(/[,;\s]+/)
    .map(s => s.trim())
    .filter(Boolean);

  for (const part of parts) {
    const n = Number(part);
    if (!Number.isInteger(n) || n < 1 || n > nd) continue;
    state.holidays.add(dateStr(state.curYear, state.curMonth, n));
  }

  saveMonthSettings();
  renderHolidaysBox();
  renderPrefTable();
}

  if (!state.curYear || !state.curMonth) {
    thead.innerHTML = '';

        <span class="pref-col-name">${esc(e.name)}</span>
      </span>

    SHIFT_CODES.map(code =>
      `<option value="${code}" ${code === selectedCode ? 'selected' : ''}>${SHIFTS[code].label}</option>`
    ).join('');

  let rows = '';
  for (let d = 1; d <= nd; d++) {
    const dow = new Date(state.curYear, state.curMonth - 1, d).getDay();
    const ds = dateStr(state.curYear, state.curMonth, d);
    const isHoliday = state.holidays.has(ds);
    const closed = isDayClosed(ds, dow);
    const rowCls = isHoliday ? 'row-holiday' : (closed ? 'row-closed' : '');

      if (closed) {
        const label = isHoliday ? 'święto' : 'zamknięte';
        rows += `<td class="prefcell"><span class="small">${label}</span></td>`;
        continue;
      }

      const p = getPref(ds, emp.id);
      const selectedShift = p && p.type === 'shift' ? p.code : null;

      // Stare "off" i "vacation" = jedna opcja „Wolne / Urlop”

        <select class="${prefVisualClass(p)}" data-action="set-pref" data-date="${ds}" data-emp="${emp.id}">

          <option value="vacation" ${isOffPref ? 'selected' : ''}>Wolne / Urlop</option>
          ${shiftOptions(selectedShift)}
        </select>
      </td>`;
    }
    rows += '</tr>';
  }
  tbody.innerHTML = rows;
