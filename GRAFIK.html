// Uwaga: nowe preferencje mają tylko typy 'vacation' i 'shift' — 'off' jest
// utrzymywane wyłącznie dla kompatybilności ze starymi danymi w localStorage
// zapisanymi przed ujednoliceniem „Wolne / Urlop” w jedną opcję.
function setPref(ds, empId, value) {
  const key = `${ds}|${empId}`;
  if (!value) delete state.prefs[key];
  else if (value === 'vacation' || value === 'off') state.prefs[key] = { type: 'vacation' };
  else state.prefs[key] = { type: 'shift', code: value };
  saveMonthSettings();
}

function clearPreferences() {
  const label = `${MONTH_NAMES[state.curMonth - 1]} ${state.curYear}`;
  if (!confirm(`Czy na pewno chcesz usunąć wszystkie preferencje dla miesiąca: ${label}?`)) return;
  state.prefs = {};
  saveMonthSettings();
  renderPrefTable();
}

function buildOpenDays(year, month) {
  const nd = daysInMonth(year, month);
  const days = [];
  for (let d = 1; d <= nd; d++) {
    const dow = new Date(year, month - 1, d).getDay();
    const ds = dateStr(year, month, d);
    const holiday = state.holidays.has(ds);
    days.push({ d, ds, dow, closed: isDayClosed(ds, dow), holiday });
  }
  return days;
}

function computeQuotas(employees, activeDays, nd) {
  const quota = {};
  const remaining = {};
  const requiredOff = {};

  for (const e of employees) {
    const hoursQuota = Math.round(e.target / 8);
    quota[e.id] = hoursQuota;

    let reqVac = 0;
    let reqOff = 0;
    for (const day of activeDays) {
      const p = getPref(day.ds, e.id);
      if (p?.type === 'vacation') reqVac++;
      else if (p?.type === 'off') reqOff++;
    }

    const availableDays = activeDays.length - reqOff - reqVac;
    const minRequiredOffDays = Math.floor(availableDays / 6);
    const maxWorkableSoft = availableDays - minRequiredOffDays;

    let plannedUrlopFromPref = 0;
    if (e.preferFreeOverUrlop === false) {
      plannedUrlopFromPref = reqVac;
    } else {
      const neededUrlop = Math.max(0, hoursQuota - maxWorkableSoft);
      plannedUrlopFromPref = Math.min(reqVac, neededUrlop);
    }

    remaining[e.id] = Math.max(0, Math.min(hoursQuota - plannedUrlopFromPref, availableDays));
    requiredOff[e.id] = nd - hoursQuota;
  }

  return { quota, remaining, requiredOff };
}


function assignDayShifts(day, index, activeDays, employees, remaining, consec, openCnt, closeCnt, midCnt, lastShift, satOffCnt, shiftJumps) {
  const scheduleDay = {};
  const totalRemainingShifts = employees.reduce((sum, e) => sum + Math.max(0, remaining[e.id]), 0);
  const remainingDays = activeDays.length - index;
  const targetMin = minStaffForDay(day);
  const isSaturday = day.dow === 6;

  let need = Math.ceil(totalRemainingShifts / remainingDays);
  need = Math.max(targetMin, Math.min(need, employees.length));

  const hardOffIds = new Set(
    employees.filter(e => isHardOff(getPref(day.ds, e.id))).map(e => e.id)
  );

  // Uczniowie nie kompletują minimalnej obsady — liczymy tylko nie-uczniów
  const regularIds = new Set(employees.filter(e => !isStudentEmp(e)).map(e => e.id));
  const regularAvailable = [...regularIds].filter(id => !hardOffIds.has(id)).length;
  const softMin = Math.min(targetMin, regularAvailable);

  const urgencies = {};
  for (const e of employees) {
    let availableFuture = 0;
    for (let i = index; i < activeDays.length; i++) {
      if (!isHardOff(getPref(activeDays[i].ds, e.id))) availableFuture++;
    }
    urgencies[e.id] =
      remaining[e.id] <= 0
        ? 0
        : availableFuture > 0
          ? remaining[e.id] / availableFuture + Math.random() * 0.01
          : 999;
  }

  const sortByUrgency = (a, b) => {
    // Preferencja konkretnej zmiany — najwyższy priorytet
    const prefA = getPref(day.ds, a.id)?.type === 'shift' ? 1 : 0;
    const prefB = getPref(day.ds, b.id)?.type === 'shift' ? 1 : 0;
    if (prefA !== prefB) return prefB - prefA;

    if (isSaturday && satOffCnt) {
      // Sprawiedliwy podział sobót: kto ma więcej wolnych, ten raczej pracuje
      const freeA = satOffCnt[a.id] || 0;
      const freeB = satOffCnt[b.id] || 0;
      if (freeA !== freeB) return freeB - freeA;
    }
    if (Math.abs(urgencies[b.id] - urgencies[a.id]) > 0.05) {
      return urgencies[b.id] - urgencies[a.id];
    }
    const imbalance = id => Math.abs((openCnt[id] || 0) - (closeCnt[id] || 0));
    if (imbalance(a.id) !== imbalance(b.id)) return imbalance(a.id) - imbalance(b.id);
    if (consec[b.id] !== consec[a.id]) return consec[a.id] - consec[b.id];
    if (remaining[b.id] !== remaining[a.id]) return remaining[b.id] - remaining[a.id];
    return Math.random() - 0.5;
  };

  const underQuota = employees.filter(
    e =>
      !hardOffIds.has(e.id) &&
      consec[e.id] < maxConsecForEmp(e) &&
      remaining[e.id] > 0
  );
  underQuota.sort(sortByUrgency);

  // Docelowa obsada dnia: tylu, ilu naprawdę jest jeszcze "pod etatem" (underQuota),
  // a gdy takich osób zabraknie — przynajmniej softMin (minimalna bezpieczna obsada,
  // resztę dobierze pullToMin() spośród osób ponad etatem).
  const actualNeed = Math.min(
    need,
    underQuota.length > 0 ? underQuota.length : softMin,
    employees.length - hardOffIds.size
  );

  let working = underQuota.slice(0, Math.min(actualNeed, underQuota.length));

  // Wymuś osoby z preferencją zmiany (wypchnij kogoś bez preferencji jeśli trzeba)
  {
    const alreadyIn = new Set(working.map(e => e.id));
    for (const e of underQuota) {
      if (alreadyIn.has(e.id)) continue;
      if (getPref(day.ds, e.id)?.type !== 'shift') continue;
      if (working.length >= employees.length - hardOffIds.size) break;
      if (working.length >= actualNeed) {
        const vIdx = working.findIndex(w => getPref(day.ds, w.id)?.type !== 'shift');
        if (vIdx === -1) break;
        alreadyIn.delete(working[vIdx].id);
        working.splice(vIdx, 1);
      }
      working.push(e);
      alreadyIn.add(e.id);
    }
  }

  // Dociągnięcie obsady — najpierw osoby z remaining > 0 (bez nadgodzin)
  const pullToMin = (minNeeded, allowOverConsec, regularsOnly) => {
    const currentCount = () => regularsOnly
      ? working.filter(e => !isStudentEmp(e)).length
      : working.length;
    if (currentCount() >= minNeeded) return;
    const alreadyIn = new Set(working.map(e => e.id));
    const pool = employees
      .filter(e => {
        if (regularsOnly && isStudentEmp(e)) return false;
        if (alreadyIn.has(e.id) || hardOffIds.has(e.id)) return false;
        if (!allowOverConsec && consec[e.id] >= maxConsecForEmp(e)) return false;
        return true;
      })
      .sort((a, b) => {
        const ra = remaining[a.id] > 0 ? 0 : 1;
        const rb = remaining[b.id] > 0 ? 0 : 1;
        if (ra !== rb) return ra - rb;
        return consec[a.id] - consec[b.id] || Math.random() - 0.5;
      });
    while (currentCount() < minNeeded && pool.length) {
      const e = pool.shift();
      working.push(e);
      alreadyIn.add(e.id);
    }
  };

  // Minimalna obsada = nie-uczniowie (uczniowie nie wliczają się w minimum)
  const staffFloor = Math.min(targetMin, regularAvailable);
  pullToMin(staffFloor, false, true);
  pullToMin(staffFloor, true, true);
  // Dodatkowo dobieraj osoby z remaining > 0 (w tym uczniów) do need — bez forsowania nadgodzin
  {
    const alreadyIn = new Set(working.map(e => e.id));
    const pool = employees
      .filter(e =>
        !alreadyIn.has(e.id) &&
        !hardOffIds.has(e.id) &&
        remaining[e.id] > 0 &&
        consec[e.id] < maxConsecForEmp(e)
      )
      .sort((a, b) => {
        const ua = urgencies[a.id] || 0;
        const ub = urgencies[b.id] || 0;
        if (Math.abs(ub - ua) > 0.05) return ub - ua;
        return Math.random() - 0.5;
      });
    const targetNeed = Math.min(need, employees.length - hardOffIds.size);
    while (working.length < targetNeed && pool.length) {
      const e = pool.shift();
      working.push(e);
      alreadyIn.add(e.id);
    }
  }

  const workingIds = new Set(working.map(e => e.id));
  const plan = getShiftPlan(working.length);
  let remainingPlan = [...plan];
  const assigned = {};
  const shiftCount = {}; // max 2 osoby na tę samą zmianę

  // Uczeń może dostać S1/S5 tylko gdy na tej zmianie jest już ktoś (nie samodzielnie)
  const studentOk = (emp, code) => {
    if (!isStudentEmp(emp)) return true;
    if (code !== 'S1' && code !== 'S5') return true;
    return (shiftCount[code] || 0) >= 1;
  };

  // Preferencje zmiany (max 2 na tę samą)
  for (const e of working) {
    const p = getPref(day.ds, e.id);
    if (!p || p.type !== 'shift') continue;
    if (!studentOk(e, p.code)) continue;
    const already = shiftCount[p.code] || 0;
    if (already >= 2) continue;
    const exactIdx = remainingPlan.indexOf(p.code);
    if (exactIdx !== -1) {
      assigned[e.id] = p.code;
      remainingPlan.splice(exactIdx, 1);
      shiftCount[p.code] = already + 1;
    } else {
      const midIdx = remainingPlan.findIndex(c => SHIFTS[c].role === 'mid');
      if (midIdx !== -1) {
        assigned[e.id] = p.code;
        remainingPlan.splice(midIdx, 1);
        shiftCount[p.code] = already + 1;
      }
    }
  }

  // Kontynuacja serii: ±1 względem wczoraj + bilans open/close
  let unassigned = working.filter(e => !assigned[e.id]);
  const continuing = unassigned
    .filter(e => consec[e.id] > 0 && lastShift[e.id])
    .sort((a, b) => SHIFTS[lastShift[b.id]].start - SHIFTS[lastShift[a.id]].start);

  for (const e of continuing) {
    const last = lastShift[e.id];
    let bestIdx = remainingPlan.length
      ? pickContinuousShift(remainingPlan, shiftCount, last, e, shiftJumps, false)
      : -1;
    if (bestIdx !== -1) {
      const code = remainingPlan[bestIdx];
      assigned[e.id] = code;
      remainingPlan.splice(bestIdx, 1);
      shiftCount[code] = (shiftCount[code] || 0) + 1;
    } else if (last && studentOk(e, last)) {
      assigned[e.id] = last;
      shiftCount[last] = (shiftCount[last] || 0) + 1;
      const planIdx = remainingPlan.indexOf(last);
      if (planIdx !== -1) remainingPlan.splice(planIdx, 1);
    }
  }

  // Pozostali z historią / bez
  unassigned = unassigned.filter(e => !assigned[e.id]);
  const roleOrder = { open: 0, close: 1, mid: 2 };
  const withHistory = unassigned.filter(e => lastShift[e.id]);
  const withoutHistory = unassigned.filter(e => !lastShift[e.id]);

  for (const e of withHistory) {
    if (remainingPlan.length === 0) break;
    const last = lastShift[e.id];
    let bestIdx = pickContinuousShift(remainingPlan, shiftCount, last, e, shiftJumps, false);
    if (bestIdx === -1) {
      remainingPlan.sort((x, y) => {
        const sx = studentOk(e, x) ? 0 : 1;
        const sy = studentOk(e, y) ? 0 : 1;
        if (sx !== sy) return sx - sy;
        const cx = shiftCount[x] || 0, cy = shiftCount[y] || 0;
        if (cx !== cy) return cx - cy;
        return roleOrder[SHIFTS[x].role] - roleOrder[SHIFTS[y].role];
      });
      bestIdx = remainingPlan.findIndex(c => studentOk(e, c) && (shiftCount[c] || 0) < 2);
    }
    if (bestIdx === -1) bestIdx = remainingPlan.findIndex(c => studentOk(e, c));
    if (bestIdx === -1) bestIdx = 0;
    const code = remainingPlan[bestIdx];
    assigned[e.id] = code;
    remainingPlan.splice(bestIdx, 1);
    shiftCount[code] = (shiftCount[code] || 0) + 1;
  }

  remainingPlan.sort((a, b) => {
    const ca = shiftCount[a] || 0, cb = shiftCount[b] || 0;
    if (ca !== cb) return ca - cb;
    return roleOrder[SHIFTS[a].role] - roleOrder[SHIFTS[b].role];
  });
  for (const code of remainingPlan) {
    if ((shiftCount[code] || 0) >= 2) continue;
    const role = SHIFTS[code].role;
    // Otwarcia/zamknięcia: najpierw nie-uczniowie (uczniowie tylko gdy już ktoś jest na zmianie)
    let pool = withoutHistory.filter(e => !assigned[e.id] && studentOk(e, code));
    if (pool.length === 0) {
      pool = unassigned.filter(e => !assigned[e.id] && studentOk(e, code));
    }
    if (pool.length === 0) continue;
    pool.sort((a, b) => {
      // Preferuj nie-uczniów przy pierwszym zajęciu S1/S5
      const sa = isStudentEmp(a) ? 1 : 0;
      const sb = isStudentEmp(b) ? 1 : 0;
      if (sa !== sb) return sa - sb;
      const countFor = id => role === 'open' ? openCnt[id] : role === 'close' ? closeCnt[id] : midCnt[id];
      const ca = countFor(a.id), cb = countFor(b.id);
      if (ca !== cb) return ca - cb;
      return Math.random() - 0.5;
    });
    assigned[pool[0].id] = code;
    shiftCount[code] = (shiftCount[code] || 0) + 1;
  }

  // Osoby bez przydziału — ciągłość serii, potem pozostała zmiana z planu lub S3
  for (const e of working) {
    if (assigned[e.id]) continue;
    const last = (consec[e.id] > 0) ? lastShift[e.id] : null;
    let midIdx = remainingPlan.length
      ? pickContinuousShift(remainingPlan, shiftCount, last, e, shiftJumps, false)
      : -1;
    if (midIdx !== -1) {
      const code = remainingPlan[midIdx];
      assigned[e.id] = code;
      remainingPlan.splice(midIdx, 1);
      shiftCount[code] = (shiftCount[code] || 0) + 1;
    } else if (last && studentOk(e, last)) {
      assigned[e.id] = last;
      shiftCount[last] = (shiftCount[last] || 0) + 1;
    } else if (!last) {
      // Start serii: preferuj rolę, której ta osoba ma najmniej
      const scored = remainingPlan
        .map((c, i) => ({ c, i, n: (shiftCount[c] || 0) }))
        .filter(x => x.n < 2 && studentOk(e, x.c));
      scored.sort((a, b) => {
        const ra = SHIFTS[a.c].role, rb = SHIFTS[b.c].role;
        const ca = ra === 'open' ? (openCnt[e.id] || 0) : ra === 'close' ? (closeCnt[e.id] || 0) : (midCnt[e.id] || 0);
        const cb = rb === 'open' ? (openCnt[e.id] || 0) : rb === 'close' ? (closeCnt[e.id] || 0) : (midCnt[e.id] || 0);
        if (ca !== cb) return ca - cb;
        return a.n - b.n;
      });
      if (scored.length) {
        const { c, i } = scored[0];
        assigned[e.id] = c;
        remainingPlan.splice(i, 1);
        shiftCount[c] = (shiftCount[c] || 0) + 1;
      } else {
        assigned[e.id] = 'S3';
      }
    } else {
      assigned[e.id] = last;
    }
  }

  for (const e of employees) {
    if (!workingIds.has(e.id)) {
      consec[e.id] = 0;
      lastShift[e.id] = null;
      if (shiftJumps) shiftJumps[e.id] = 0; // nowa seria po wolnym
      const pref = getPref(day.ds, e.id);
      if (pref?.type === 'vacation') {
        scheduleDay[e.id] = e.preferFreeOverUrlop === false ? 'Urlop' : 'Wolne';
      } else {
        scheduleDay[e.id] = 'Wolne';
      }
      if (isSaturday && satOffCnt) satOffCnt[e.id] = (satOffCnt[e.id] || 0) + 1;
      continue;
    }

    let code = assigned[e.id];
    // Uczeń solo na S1/S5 → środkowa (post-pass też to dogląda)
    if (code && isStudentEmp(e) && (code === 'S1' || code === 'S5') && (shiftCount[code] || 0) < 2) {
      // shiftCount zawiera już tego ucznia — solo gdy count === 1
      if ((shiftCount[code] || 0) <= 1) code = 'S3';
    }
    const prevConsec = consec[e.id];
    const prevLast = lastShift[e.id];
    consec[e.id]++;
    remaining[e.id]--;

    if (code && SHIFTS[code]) {
      // Skok godziny w środku serii (nie pierwszy dzień po wolnym)
      if (shiftJumps && prevConsec > 0 && prevLast && code !== prevLast) {
        shiftJumps[e.id] = (shiftJumps[e.id] || 0) + 1;
      }
      scheduleDay[e.id] = SHIFTS[code].label;
      lastShift[e.id] = code;
      if (SHIFTS[code].role === 'open') openCnt[e.id]++;
      else if (SHIFTS[code].role === 'close') closeCnt[e.id]++;
      else midCnt[e.id]++;
    } else {
      scheduleDay[e.id] = SHIFTS.S2.label;
      lastShift[e.id] = 'S2';
      midCnt[e.id]++;
    }
  }

  return scheduleDay;
}

/** Liczy obsadę dnia bez uczniów (uczniowie nie kompletują minimum). */
function countWorkingOnDay(schedule, day, employees) {
  let n = 0;
  for (const e of employees) {
    if (isStudentEmp(e)) continue;
    if (isWorkingVal(schedule[day.ds]?.[e.id])) n++;
  }
  return n;
}

function hasOpenCloseCoverage(schedule, day, employees, excludeEmpId) {
  let hasOpen = false;
  let hasClose = false;
  let count = 0;
  for (const e of employees) {
    if (e.id === excludeEmpId) continue;
    const val = schedule[day.ds]?.[e.id];
    if (!isWorkingVal(val)) continue;
    // Uczniowie nie wliczają się do minimalnej obsady
    if (!isStudentEmp(e)) count++;
    if (val === SHIFTS.S1.label) hasOpen = true;
    if (val === SHIFTS.S5.label) hasClose = true;
  }
  return { count, hasOpen, hasClose };
}

function wouldBreakConsec(empId, targetDs, schedule, openDays) {
  const byDs = new Map(openDays.map(d => [d.ds, d]));
  const target = byDs.get(targetDs);
  if (!target || target.closed) return true;

  // Symulacja: ten dzień jako praca, reszta bez zmian
  let streak = 0;
  let maxStreak = 0;
  for (const day of openDays) {
    if (day.closed) {
      streak = 0;
      continue;
    }
    let works;
    if (day.ds === targetDs) works = true;
    else works = isWorkingVal(schedule[day.ds]?.[empId]);
    if (works) {
      streak++;
      maxStreak = Math.max(maxStreak, streak);
    } else {
      streak = 0;
    }
  }
  return maxStreak > maxConsecForEmp(empId);
}

/**
 * Wyrównuje liczbę otwarć i zamknięć między pracownikami przez zamiany
 * etykiet zmian w obrębie tego samego dnia (obsada i etat bez zmian).
 */
function equalizeOpenCloseRoles(employees, openDays, schedule) {
  const canTouch = (day, empId, currentCode) => {
    if (isCellLocked(day.ds, empId)) return false;
    const p = getPref(day.ds, empId);
    if (p?.type === 'shift' && p.code === currentCode) return false;
    return true;
  };
  // Uczniowie nie biorą udziału w sprawiedliwym rozdzielaniu otwarć/zamknięć
  const regulars = employees.filter(e => !isStudentEmp(e));

  const dayIndex = {};
  openDays.forEach((d, i) => { dayIndex[d.ds] = i; });

  const neighborWorkCode = (empId, fromIdx, dir) => {
    const from = openDays[fromIdx];
    const i = fromIdx + dir;
    if (i < 0 || i >= openDays.length) return null;
    const d = openDays[i];
    if (Math.abs(calendarDayDiff(from.ds, d.ds)) !== 1) return null;
    if (d.closed) return null;
    const v = schedule[d.ds][empId];
    if (!isWorkingVal(v)) return null;
    return labelToShiftCode(v);
  };

  const transitionOk = (empId, dayIdx, newCode) => {
    const prev = neighborWorkCode(empId, dayIdx, -1);
    if (prev && !shiftAllowedAfter(prev, newCode)) return false;
    const next = neighborWorkCode(empId, dayIdx, +1);
    if (next && !shiftAllowedAfter(newCode, next)) return false;
    return true;
  };

  const trySwapLabels = (day, a, b, codeA, codeB, counts) => {
    if (!canTouch(day, a.id, codeA)) return false;
    if (!canTouch(day, b.id, codeB)) return false;
    const idx = dayIndex[day.ds];
    if (idx != null) {
      if (!transitionOk(a.id, idx, codeB)) return false;
      if (!transitionOk(b.id, idx, codeA)) return false;
    }
    schedule[day.ds][a.id] = SHIFTS[codeB].label;
    schedule[day.ds][b.id] = SHIFTS[codeA].label;
    const roleA = SHIFTS[codeA].role;
    const roleB = SHIFTS[codeB].role;
    if (counts) {
      counts[a.id][roleA]--;
      counts[a.id][roleB]++;
      counts[b.id][roleB]--;
      counts[b.id][roleA]++;
    }
    return true;
  };

  // Cel: max−min ≤ 2 dla open i close wśród regularów z ≥1 dniem pracy
  const TARGET_SPREAD = 2;

  for (const role of ['open', 'close']) {
    for (let pass = 0; pass < 120; pass++) {
      const counts = computeRoleCounts(employees, openDays, schedule);
      const active = regulars.filter(e =>
        (counts[e.id].open + counts[e.id].close + counts[e.id].mid) > 0
      );
      if (active.length < 2) break;

      const sorted = [...active].sort((a, b) => counts[a.id][role] - counts[b.id][role]);
      const minC = counts[sorted[0].id][role];
      const maxC = counts[sorted[sorted.length - 1].id][role];
      if (maxC - minC <= TARGET_SPREAD) break;

      // Próbuj wiele par (nie tylko skrajne) — bogatsi oddają potrzebującym
      let swapped = false;
      const needies = sorted.filter(e => counts[e.id][role] <= minC + 1);
      const riches = [...sorted].reverse().filter(e => counts[e.id][role] >= maxC - 1);

      for (const rich of riches) {
        for (const needy of needies) {
          if (rich.id === needy.id) continue;
          if (counts[rich.id][role] - counts[needy.id][role] <= TARGET_SPREAD) continue;

          for (const day of openDays) {
            if (day.closed) continue;
            const valRich = schedule[day.ds][rich.id];
            const valNeed = schedule[day.ds][needy.id];
            if (!isWorkingVal(valRich) || !isWorkingVal(valNeed)) continue;

            const codeRich = labelToShiftCode(valRich);
            const codeNeed = labelToShiftCode(valNeed);
            if (!codeRich || !codeNeed) continue;
            if (SHIFTS[codeRich].role !== role) continue;
            if (SHIFTS[codeNeed].role === role) continue;

            if (trySwapLabels(day, rich, needy, codeRich, codeNeed, counts)) {
              swapped = true;
              break;
            }
          }
          if (swapped) break;
        }
        if (swapped) break;
      }
      if (!swapped) break;
    }
  }

  // Lokalne zamiany open↔mid / close↔mid / open↔close gdy różnica > TARGET_SPREAD
  for (let pass = 0; pass < 100; pass++) {
    const counts = computeRoleCounts(employees, openDays, schedule);
    let improved = false;

    for (const day of openDays) {
      if (day.closed) continue;
      const workers = regulars.filter(e => isWorkingVal(schedule[day.ds][e.id]));

      for (let i = 0; i < workers.length; i++) {
        for (let j = 0; j < workers.length; j++) {
          if (i === j) continue;
          const a = workers[i];
          const b = workers[j];
          const codeA = labelToShiftCode(schedule[day.ds][a.id]);
          const codeB = labelToShiftCode(schedule[day.ds][b.id]);
          if (!codeA || !codeB) continue;
          const roleA = SHIFTS[codeA].role;
          const roleB = SHIFTS[codeB].role;

          // open → mid: a ma za dużo open, b za mało
          if (roleA === 'open' && roleB === 'mid' &&
              counts[a.id].open - counts[b.id].open > TARGET_SPREAD) {
            if (trySwapLabels(day, a, b, codeA, codeB, counts)) {
              improved = true;
              continue;
            }
          }
          if (roleA === 'close' && roleB === 'mid' &&
              counts[a.id].close - counts[b.id].close > TARGET_SPREAD) {
            if (trySwapLabels(day, a, b, codeA, codeB, counts)) {
              improved = true;
              continue;
            }
          }
          // open ↔ close gdy obie strony zyskują na bilansie
          if (roleA === 'open' && roleB === 'close' &&
              counts[a.id].open - counts[b.id].open > TARGET_SPREAD &&
              counts[b.id].close - counts[a.id].close > 0) {
            if (trySwapLabels(day, a, b, codeA, codeB, counts)) {
              improved = true;
            }
          }
        }
      }
    }
    if (!improved) break;
  }
}


function rebalanceStaffing(employees, openDays, schedule) {
  const activeDays = openDays.filter(d => !d.closed);

  const tryFillDeficit = (allowBreakConsec) => {
    for (const deficitDay of activeDays) {
      const targetMin = minStaffForDay(deficitDay);
      let workingCount = countWorkingOnDay(schedule, deficitDay, employees);
      if (workingCount >= targetMin) continue;

      // Tylko nie-uczniowie kompletują minimum obsady
      const candidates = employees.filter(e => {
        if (isStudentEmp(e)) return false;
        if (isCellLocked(deficitDay.ds, e.id)) return false;
        const val = schedule[deficitDay.ds][e.id];
        if (val !== 'Wolne') return false;
        if (isHardOff(getPref(deficitDay.ds, e.id))) return false;
        if (!allowBreakConsec && wouldBreakConsec(e.id, deficitDay.ds, schedule, openDays)) return false;
        return true;
      });

      candidates.sort(() => Math.random() - 0.5);

      for (const e of candidates) {
        if (workingCount >= targetMin) break;

        let bestSource = null;
        for (const src of activeDays) {
          if (src.ds === deficitDay.ds) continue;
          if (isCellLocked(src.ds, e.id)) continue;
          if (!isWorkingVal(schedule[src.ds][e.id])) continue;

          const srcMin = minStaffForDay(src);
          const cov = hasOpenCloseCoverage(schedule, src, employees, e.id);
          if (cov.count < srcMin) continue;
          if (!cov.hasOpen || !cov.hasClose) continue;

          if (!bestSource || cov.count > bestSource.count) {
            bestSource = { day: src, count: cov.count };
          }
        }

        if (!bestSource) {
          // Brak dnia-dawcy z nadwyżką — i tak dopisz na deficyt (obsada > etat/soboty)
          // tylko gdy allowBreakConsec (ostateczność) lub nie łamie limitu
          if (!allowBreakConsec) continue;
          schedule[deficitDay.ds][e.id] = SHIFTS[pickShiftCodeForDay(deficitDay, employees, schedule, null, e)].label;
          workingCount++;
          continue;
        }

        schedule[bestSource.day.ds][e.id] = 'Wolne';
        schedule[deficitDay.ds][e.id] = SHIFTS[pickShiftCodeForDay(deficitDay, employees, schedule, null, e)].label;
        workingCount++;
      }
    }
  };

  tryFillDeficit(false);
  // Minimum obsady ma pierwszeństwo nad limitem 5 dni z rzędu i wolnymi sobotami
  tryFillDeficit(true);
}

function fillHoursDeficit(employees, openDays, activeDays, schedule, quota) {
  for (const e of employees) {
    if (e.preferFreeOverUrlop === false) continue;
    const urlopDays = openDays.filter(d => schedule[d.ds]?.[e.id] === 'Urlop').length;
    let deficit = quota[e.id] - countWorkedDays(e.id, openDays, schedule) - urlopDays;
    if (deficit <= 0) continue;

    for (let i = 0; i < activeDays.length && deficit > 0; i++) {
      const day = activeDays[i];
      if (isCellLocked(day.ds, e.id)) continue;
      const p = getPref(day.ds, e.id);
      if (schedule[day.ds][e.id] === 'Wolne' && p?.type === 'vacation') {
        schedule[day.ds][e.id] = 'Urlop';
        deficit--;
      }
    }
  }
}

/**
 * Usuń nadgodziny: gdy ktoś ma więcej dni etatu niż quota,
 * oddaj zbędny dzień (Wolne), o ile min. obsada i open/close się utrzymają.
 */
function trimOvertime(employees, openDays, schedule, quota) {
  const activeDays = openDays.filter(d => !d.closed);

  for (let pass = 0; pass < 40; pass++) {
    let trimmed = false;

    for (const e of employees) {
      let excess = etatDays(e.id, openDays, schedule) - quota[e.id];
      if (excess <= 0) continue;

      const workDays = activeDays.filter(day => {
        if (isCellLocked(day.ds, e.id)) return false;
        if (!isWorkingVal(schedule[day.ds][e.id])) return false;
        // Preferencji hard-off nie ruszamy
        if (isHardOff(getPref(day.ds, e.id))) return false;

        // Po usunięciu e obsada regularna nadal ≥ minimum
        const regularsLeft = employees.filter(o =>
          o.id !== e.id &&
          !isStudentEmp(o) &&
          isWorkingVal(schedule[day.ds][o.id])
        ).length;
        if (regularsLeft < minStaffForDay(day)) return false;

        // Nie zabieraj jedynego otwarcia / zamknięcia
        const val = schedule[day.ds][e.id];
        if (val === SHIFTS.S1.label) {
          const otherOpen = employees.some(o =>
            o.id !== e.id && schedule[day.ds][o.id] === SHIFTS.S1.label
          );
          if (!otherOpen) return false;
        }
        if (val === SHIFTS.S5.label) {
          const otherClose = employees.some(o =>
            o.id !== e.id && schedule[day.ds][o.id] === SHIFTS.S5.label
          );
          if (!otherClose) return false;
        }
        return true;
      });

      if (!workDays.length) continue;

      workDays.sort((a, b) => {
        // Najpierw soboty, potem dni z większą nadwyżką obsady
        const satA = a.dow === 6 ? 0 : 1;
        const satB = b.dow === 6 ? 0 : 1;
        if (satA !== satB) return satA - satB;
        const surplus = day =>
          employees.filter(o =>
            o.id !== e.id && !isStudentEmp(o) && isWorkingVal(schedule[day.ds][o.id])
          ).length - minStaffForDay(day);
        return surplus(b) - surplus(a) || b.d - a.d;
      });

      schedule[workDays[0].ds][e.id] = 'Wolne';
      trimmed = true;
    }

    if (!trimmed) break;
  }
}

function ensureHourQuotas(employees, openDays, schedule, quota) {
  const activeDays = openDays.filter(d => !d.closed);

  for (const e of employees) {
    let deficit = quota[e.id] - etatDays(e.id, openDays, schedule);
    if (deficit <= 0) continue;

    // Kandydaci: dni z „Wolne”, bez twardego off/urlopu
    const candidates = activeDays.filter(day => {
      if (isCellLocked(day.ds, e.id)) return false;
      if (schedule[day.ds][e.id] !== 'Wolne') return false;
      if (isHardOff(getPref(day.ds, e.id))) return false;
      return true;
    });

    // Sortuj: najpierw dni poniżej min. obsady, potem nie-soboty, potem soboty
    candidates.sort((a, b) => {
      const staffA = countWorkingOnDay(schedule, a, employees);
      const staffB = countWorkingOnDay(schedule, b, employees);
      const needA = staffA < minStaffForDay(a) ? 0 : 1;
      const needB = staffB < minStaffForDay(b) ? 0 : 1;
      if (needA !== needB) return needA - needB;
      const satA = a.dow === 6 ? 1 : 0;
      const satB = b.dow === 6 ? 1 : 0;
      if (satA !== satB) return satA - satB;
      return a.d - b.d;
    });

    for (const day of candidates) {
      if (deficit <= 0) break;
      // Unikaj łamania limitu z rzędu, ale przy braku innych opcji i tak dopisz (etat nadrzędny)
      const breaks = wouldBreakConsec(e.id, day.ds, schedule, openDays);
      if (breaks) {
        // Sprawdź czy jest jeszcze jakiś dzień, który nie łamie limitu
        const hasSafer = candidates.some(d =>
          d.ds !== day.ds &&
          schedule[d.ds][e.id] === 'Wolne' &&
          !isHardOff(getPref(d.ds, e.id)) &&
          !wouldBreakConsec(e.id, d.ds, schedule, openDays)
        );
        if (hasSafer) continue;
        // Brak bezpieczniejszej opcji — i tak dopisz (etat > limit)
      }

      schedule[day.ds][e.id] = SHIFTS[pickShiftCodeForDay(day, employees, schedule, null, e)].label;
      deficit--;
    }
  }

  // Druga fala: jeśli nadal brakuje godzin, zabierz dzień komuś z nadwyżką (powyżej etatu)
  for (const e of employees) {
    let deficit = quota[e.id] - etatDays(e.id, openDays, schedule);
    if (deficit <= 0) continue;

    for (const day of activeDays) {
      if (deficit <= 0) break;
      if (isCellLocked(day.ds, e.id)) continue;
      if (schedule[day.ds][e.id] !== 'Wolne') continue;
      if (isHardOff(getPref(day.ds, e.id))) continue;

      // Nadwyżka = praca+urlop > etat
      const donors = employees.filter(o => {
        if (o.id === e.id) return false;
        if (isCellLocked(day.ds, o.id)) return false;
        if (!isWorkingVal(schedule[day.ds][o.id])) return false;
        if (isHardOff(getPref(day.ds, o.id))) return false;
        return etatDays(o.id, openDays, schedule) > quota[o.id];
      }).sort((a, b) =>
        etatDays(b.id, openDays, schedule) - etatDays(a.id, openDays, schedule)
      );

      if (donors.length === 0) {
        schedule[day.ds][e.id] = SHIFTS[pickShiftCodeForDay(day, employees, schedule, null, e)].label;
        deficit--;
        continue;
      }

      const donor = donors[0];
      // Donor oddaje dzień (Wolne), e przejmuje sensowną zmianę
      schedule[day.ds][donor.id] = 'Wolne';
      schedule[day.ds][e.id] = SHIFTS[pickShiftCodeForDay(day, employees, schedule, null, e)].label;
      deficit--;
    }
  }
}

const LABEL_TO_CODE = Object.fromEntries(SHIFT_CODES.map(c => [SHIFTS[c].label, c]));
const labelToShiftCode = label => LABEL_TO_CODE[label] || null;

function pickShiftCodeForDay(day, employees, schedule, excludeId, forEmp) {
  let hasOpen = false, hasClose = false;
  const used = new Set();
  const codeCount = {};
  for (const o of employees) {
    if (excludeId && o.id === excludeId) continue;
    const v = schedule[day.ds][o.id];
    if (!isWorkingVal(v)) continue;
    used.add(v);
    const c = labelToShiftCode(v);
    if (c) codeCount[c] = (codeCount[c] || 0) + 1;
    if (v === SHIFTS.S1.label) hasOpen = true;
    if (v === SHIFTS.S5.label) hasClose = true;
  }

  // Preferuj wczorajszą zmianę pracownika (ciągłość serii), jeśli slot jest wolny
  let prevCode = null;
  if (forEmp && state.curYear && state.curMonth && day.d > 1) {
    const prevDs = dateStr(state.curYear, state.curMonth, day.d - 1);
    const prevVal = schedule[prevDs]?.[forEmp.id];
    if (isWorkingVal(prevVal)) prevCode = labelToShiftCode(prevVal);
  }
  const canTake = (code) => {
    if ((codeCount[code] || 0) >= 2) return false;
    if (forEmp && isStudentEmp(forEmp) && (code === 'S1' || code === 'S5')) {
      return (codeCount[code] || 0) >= 1;
    }
    return true;
  };

  // Uczeń: S1/S5 tylko gdy ktoś już jest na tej zmianie; inaczej środkowa
  if (forEmp && isStudentEmp(forEmp)) {
    if (prevCode && canTake(prevCode)) return prevCode;
    const openN = codeCount.S1 || 0;
    const closeN = codeCount.S5 || 0;
    if (openN >= 1 && openN < 2) return 'S1';
    if (closeN >= 1 && closeN < 2) return 'S5';
    if (!used.has(SHIFTS.S2.label)) return 'S2';
    if (!used.has(SHIFTS.S3.label)) return 'S3';
    if (!used.has(SHIFTS.S4.label)) return 'S4';
    return 'S3';
  }
  if (!hasOpen) return 'S1';
  if (!hasClose) return 'S5';
  if (prevCode && canTake(prevCode)) return prevCode;
  if (!used.has(SHIFTS.S2.label)) return 'S2';
  if (!used.has(SHIFTS.S3.label)) return 'S3';
  if (!used.has(SHIFTS.S4.label)) return 'S4';
  return 'S3';
}

/**
 * Twarda gwarancja: każdy otwarty dzień ma co najmniej jedno otwarcie (S1)
 * i jedno zamknięcie (S5). Wywoływać na końcu generacji — post-passy
 * (wyrównanie ról, wygładzanie, uczeń, trim) potrafią to przypadkiem zabrać.
 */
function ensureOpenAndClose(employees, openDays, schedule) {
  for (const day of openDays) {
    if (day.closed) continue;

    const workers = employees.filter(e => isWorkingVal(schedule[day.ds]?.[e.id]));
    if (!workers.length) continue;

    const roleCounts = computeRoleCounts(employees, openDays, schedule);

    // Soft: szanuj ciągłość + preferencje + ucznia
    const canTakeSoft = (e, code) => {
      if (isCellLocked(day.ds, e.id)) return false;
      const p = getPref(day.ds, e.id);
      if (p?.type === 'shift' && p.code && p.code !== code) return false;
      if (isStudentEmp(e) && (code === 'S1' || code === 'S5')) {
        const n = workers.filter(w =>
          w.id !== e.id && labelToShiftCode(schedule[day.ds][w.id]) === code
        ).length;
        if (n < 1) return false;
      }
      if (day.d > 1) {
        const prevDs = dateStr(state.curYear, state.curMonth, day.d - 1);
        const prevVal = schedule[prevDs]?.[e.id];
        if (isWorkingVal(prevVal)) {
          const prevCode = labelToShiftCode(prevVal);
          if (prevCode && !shiftAllowedAfter(prevCode, code)) return false;
        }
      }
      return true;
    };

    // Hard: TYLKO lock i twarda preferencja innej zmiany — open/close salonu ma priorytet
    const canTakeHard = (e, code) => {
      if (isCellLocked(day.ds, e.id)) return false;
      const p = getPref(day.ds, e.id);
      if (p?.type === 'shift' && p.code && p.code !== code) return false;
      return true;
    };

    const scoreCandidate = (e, code) => {
      // niższy = lepszy
      let s = 0;
      if (isStudentEmp(e)) s += 100;
      const cur = labelToShiftCode(schedule[day.ds][e.id]);
      if (cur && SHIFTS[cur].role === 'mid') s += 0;
      else if (cur === code) s -= 5; // już na tej roli
      else s += 10; // zabiera inną rolę open/close
      if (code === 'S1') s += (roleCounts[e.id]?.open || 0);
      if (code === 'S5') s += (roleCounts[e.id]?.close || 0);
      return s;
    };

    const pick = (code, soft) => {
      const test = soft ? canTakeSoft : canTakeHard;
      const pool = workers.filter(e => test(e, code));
      if (!pool.length) return null;
      pool.sort((a, b) => scoreCandidate(a, code) - scoreCandidate(b, code));
      return pool[0];
    };

    const assignRole = (code) => {
      let e = pick(code, true);
      if (!e) e = pick(code, false); // twarde wymuszenie
      if (!e) return false;

      // Unikaj dawania tej samej osobie obu ról, gdy jest ktoś inny
      const otherCode = code === 'S1' ? 'S5' : 'S1';
      if (schedule[day.ds][e.id] === SHIFTS[otherCode].label) {
        const alt = workers
          .filter(w => w.id !== e.id && (canTakeSoft(w, code) || canTakeHard(w, code)))
          .sort((a, b) => scoreCandidate(a, code) - scoreCandidate(b, code));
        if (alt.length) e = alt[0];
      }
      schedule[day.ds][e.id] = SHIFTS[code].label;
      return true;
    };

    let hasOpen = workers.some(e => schedule[day.ds][e.id] === SHIFTS.S1.label);
    let hasClose = workers.some(e => schedule[day.ds][e.id] === SHIFTS.S5.label);

    if (!hasOpen) assignRole('S1');
    if (!hasClose) assignRole('S5');

    // Finalna weryfikacja — jeśli nadal brak, twarde przypisanie na pierwszego nie-zablokowanego
    hasOpen = employees.some(e => schedule[day.ds]?.[e.id] === SHIFTS.S1.label);
    hasClose = employees.some(e => schedule[day.ds]?.[e.id] === SHIFTS.S5.label);

    if (!hasOpen) {
      const e = workers.find(w => !isCellLocked(day.ds, w.id) &&
        schedule[day.ds][w.id] !== SHIFTS.S5.label) ||
        workers.find(w => !isCellLocked(day.ds, w.id));
      if (e) schedule[day.ds][e.id] = SHIFTS.S1.label;
    }
    if (!hasClose) {
      const e = workers.find(w => !isCellLocked(day.ds, w.id) &&
        schedule[day.ds][w.id] !== SHIFTS.S1.label) ||
        workers.find(w => !isCellLocked(day.ds, w.id));
      if (e) schedule[day.ds][e.id] = SHIFTS.S5.label;
    }

    // Gdy po hard-force obie role na jednej osobie i jest ≥2 pracowników — rozdziel
    hasOpen = employees.some(e => schedule[day.ds]?.[e.id] === SHIFTS.S1.label);
    hasClose = employees.some(e => schedule[day.ds]?.[e.id] === SHIFTS.S5.label);
    const openEmp = employees.find(e => schedule[day.ds]?.[e.id] === SHIFTS.S1.label);
    const closeEmp = employees.find(e => schedule[day.ds]?.[e.id] === SHIFTS.S5.label);
    if (openEmp && closeEmp && openEmp.id === closeEmp.id && workers.length >= 2) {
      // niemożliwe w jednej komórce — napraw: ktoś inny bierze close
      const alt = workers.find(w => w.id !== openEmp.id && !isCellLocked(day.ds, w.id));
      if (alt) schedule[day.ds][alt.id] = SHIFTS.S5.label;
    }
  }
}


function enforceStudentNoOpenClose(employees, openDays, schedule) {
  for (const day of openDays) {
    if (day.closed) continue;

    for (const code of ['S1', 'S5']) {
      const onShift = employees.filter(e =>
        isWorkingVal(schedule[day.ds]?.[e.id]) &&
        labelToShiftCode(schedule[day.ds][e.id]) === code
      );
      if (onShift.length === 0) continue;

      const others = onShift.filter(e => !isStudentEmp(e));
      const students = onShift.filter(e => isStudentEmp(e));
      // Jest nie-uczeń na zmianie → uczniowie mogą zostać
      if (others.length > 0) continue;
      // Tylko uczniowie (lub jeden uczeń solo) — nie mogą samodzielnie otwierać/zamykać
      for (const e of students) {
        if (isCellLocked(day.ds, e.id)) continue;

        // Spróbuj dobić partnera: nie-uczeń ze środkowej → ta sama zmiana
        let paired = false;
        for (const o of employees) {
          if (o.id === e.id || isStudentEmp(o)) continue;
          if (isCellLocked(day.ds, o.id)) continue;
          if (!isWorkingVal(schedule[day.ds][o.id])) continue;
          const oCode = labelToShiftCode(schedule[day.ds][o.id]);
          if (!oCode || SHIFTS[oCode].role !== 'mid') continue;
          const op = getPref(day.ds, o.id);
          if (op?.type === 'shift' && op.code === oCode) continue;
          // max 2 na zmianę — onShift.length to sami uczniowie
          if (onShift.length >= 2) break;
          schedule[day.ds][o.id] = SHIFTS[code].label;
          paired = true;
          break;
        }
        if (paired) continue;

        // Brak partnera → uczeń na zmianę środkową
        schedule[day.ds][e.id] = SHIFTS.S3.label;
      }
    }
  }
}

function computeRoleCounts(employees, openDays, schedule) {
  const counts = {};
  for (const e of employees) {
    counts[e.id] = { open: 0, close: 0, mid: 0 };
  }
  for (const day of openDays) {
    if (day.closed) continue;
    for (const e of employees) {
      const code = labelToShiftCode(schedule[day.ds]?.[e.id]);
      if (!code) continue;
      const role = SHIFTS[code].role;
      counts[e.id][role]++;
    }
  }
  return counts;
}

function computeFreeSaturdays(employees, openDays, schedule) {
  const counts = {};
  for (const e of employees) counts[e.id] = 0;
  for (const day of openDays) {
    if (day.closed || day.dow !== 6) continue;
    for (const e of employees) {
      const val = schedule[day.ds]?.[e.id];
      if (val === 'Wolne' || val === 'Urlop') counts[e.id]++;
    }
  }
  return counts;
}

function equalizeFreeSaturdays(employees, openDays, schedule) {
  const activeDays = openDays.filter(d => !d.closed);
  const saturdays = activeDays.filter(d => d.dow === 6);
  const weekdays = activeDays.filter(d => d.dow !== 6);
  if (saturdays.length === 0) return;

  // Sprawiedliwy podział wolnych sobót między wszystkimi (max−min ≤ 1), jak open/close
  const runForGroup = (group) => {
    if (group.length < 2) return;

    for (let pass = 0; pass < 40; pass++) {
      const counts = computeFreeSaturdays(employees, openDays, schedule);
      const sorted = [...group].sort((a, b) => (counts[a.id] || 0) - (counts[b.id] || 0));
      const needy = sorted[0];
      const rich = sorted[sorted.length - 1];
      const nNeed = counts[needy.id] || 0;
      const nRich = counts[rich.id] || 0;

      // Różnica max 1 — wystarczająco równo
      if (nRich - nNeed <= 1) break;

      // Szukaj soboty: rich ma Wolne/Urlop, needy pracuje
      let swapped = false;
      for (const sat of saturdays) {
        if (isCellLocked(sat.ds, rich.id) || isCellLocked(sat.ds, needy.id)) continue;
        const richVal = schedule[sat.ds][rich.id];
        const needVal = schedule[sat.ds][needy.id];
        if (!(richVal === 'Wolne' || richVal === 'Urlop')) continue;
        if (!isWorkingVal(needVal)) continue;
        if (isHardOff(getPref(sat.ds, rich.id))) continue; // nie zabieraj twardego wolnego
        if (isHardOff(getPref(sat.ds, needy.id))) continue;

        // Kompensacja etatu: dzień powszedni gdzie rich pracuje, a needy ma Wolne
        // Zamiana tylko gdy obsada regularna nie spadnie poniżej minimum
        let compDay = null;
        for (const wd of weekdays) {
          if (isCellLocked(wd.ds, rich.id) || isCellLocked(wd.ds, needy.id)) continue;
          if (!isWorkingVal(schedule[wd.ds][rich.id])) continue;
          if (schedule[wd.ds][needy.id] !== 'Wolne') continue;
          if (isHardOff(getPref(wd.ds, needy.id))) continue;
          if (isHardOff(getPref(wd.ds, rich.id))) continue;

          // Sobota po zamianie: needy (praca→Wolne), rich (Wolne→praca)
          const satRegularAfter = employees.filter(o => {
            if (isStudentEmp(o)) return false;
            if (o.id === needy.id) return false; // wychodzi
            if (o.id === rich.id) return !isStudentEmp(rich); // wchodzi, jeśli nie-uczeń
            return isWorkingVal(schedule[sat.ds][o.id]);
          }).length;
          if (satRegularAfter < minStaffForDay(sat)) continue;

          // Weekday po zamianie: rich wychodzi, needy wchodzi
          const wdRegularAfter = employees.filter(o => {
            if (isStudentEmp(o)) return false;
            if (o.id === rich.id) return false;
            if (o.id === needy.id) return !isStudentEmp(needy);
            return isWorkingVal(schedule[wd.ds][o.id]);
          }).length;
          if (wdRegularAfter < minStaffForDay(wd)) continue;

          compDay = wd;
          break;
        }

        if (!compDay) continue;

        // Zamiana soboty: needy → Wolne, rich → praca
        schedule[sat.ds][needy.id] = 'Wolne';
        schedule[sat.ds][rich.id] = SHIFTS[pickShiftCodeForDay(sat, employees, schedule, needy.id, rich)].label;

        // Kompensata weekday: rich → Wolne, needy → praca
        schedule[compDay.ds][rich.id] = 'Wolne';
        schedule[compDay.ds][needy.id] = SHIFTS[pickShiftCodeForDay(compDay, employees, schedule, rich.id, needy)].label;

        swapped = true;
        break;
      }

      if (!swapped) break;
    }
  };

  // Soboty zawsze sprawiedliwie między wszystkimi
  runForGroup(employees);
}

/**
 * Wygładź przejścia zmian między kolejnymi dniami pracy:
 * skok max ±1 pozycja (S1↔S2↔S3↔S4↔S5). Zamienia etykiety w obrębie dnia.
 */
function smoothShiftTransitions(employees, openDays, schedule) {
  const activeDays = openDays.filter(d => !d.closed);

  const tryImprove = (strictPartner) => {
    let improved = false;
    for (const e of employees) {
      for (let i = 1; i < activeDays.length; i++) {
        const prev = activeDays[i - 1];
        const day = activeDays[i];
        if (calendarDayDiff(prev.ds, day.ds) !== 1) continue;
        const prevVal = schedule[prev.ds][e.id];
        const curVal = schedule[day.ds][e.id];
        if (!isWorkingVal(prevVal) || !isWorkingVal(curVal)) continue;

        const prevCode = labelToShiftCode(prevVal);
        const curCode = labelToShiftCode(curVal);
        if (!prevCode || !curCode) continue;
        // Idealnie: ta sama zmiana — nie ruszaj; wariacje ±1 też próbuj wygładzić
        const curDist = shiftDist(prevCode, curCode);
        if (curDist === 0) continue;
        if (isCellLocked(day.ds, e.id)) continue;

        const pref = getPref(day.ds, e.id);
        if (pref?.type === 'shift' && pref.code === curCode) continue;

        const workers = employees.filter(w =>
          w.id !== e.id && isWorkingVal(schedule[day.ds][w.id]) && !isCellLocked(day.ds, w.id)
        );
        let best = null;
        let bestDist = curDist;
        let bestAllowed = shiftAllowedAfter(prevCode, curCode);

        for (const w of workers) {
          const wCode = labelToShiftCode(schedule[day.ds][w.id]);
          if (!wCode) continue;
          // Po zamianie uczeń nie może zostać sam na S1/S5
          const wouldLeaveStudentSolo = (who, getsCode) => {
            if (!isStudentEmp(who)) return false;
            if (getsCode !== 'S1' && getsCode !== 'S5') return false;
            const others = employees.filter(x =>
              x.id !== who.id &&
              isWorkingVal(schedule[day.ds][x.id]) &&
              labelToShiftCode(schedule[day.ds][x.id]) === getsCode
            );
            // partner w tej zamianie: jeśli ktoś oddaje tę zmianę, nie liczy się
            return others.length === 0;
          };
          if (wouldLeaveStudentSolo(e, wCode)) continue;
          if (wouldLeaveStudentSolo(w, curCode)) continue;
          const wp = getPref(day.ds, w.id);
          if (wp?.type === 'shift' && wp.code === wCode) continue;

          const allowedE = shiftAllowedAfter(prevCode, wCode);
          const newDistE = shiftDist(prevCode, wCode);
          // Tylko realna poprawa ciągłości (mniejszy dystans); silnie preferuj tę samą zmianę
          if (newDistE >= bestDist) continue;
          if (bestAllowed && !allowedE) continue;
          // Przy już dozwolonym przejściu (±1) — zamieniaj tylko na dokładnie tę samą zmianę
          if (bestAllowed && newDistE > 0) continue;

          const wPrev = schedule[prev.ds][w.id];
          const wPrevCode = isWorkingVal(wPrev) ? labelToShiftCode(wPrev) : null;
          if (wPrevCode) {
            const partnerOk = shiftAllowedAfter(wPrevCode, curCode);
            if (strictPartner) {
              if (!partnerOk) continue;
            } else {
              const partnerOldOk = shiftAllowedAfter(wPrevCode, wCode);
              if (!partnerOk && partnerOldOk) continue;
            }
          }
          if (i + 1 < activeDays.length) {
            const nxt = activeDays[i + 1];
            const wNext = schedule[nxt.ds][w.id];
            if (isWorkingVal(wNext)) {
              const wNextCode = labelToShiftCode(wNext);
              if (wNextCode && !shiftAllowedAfter(curCode, wNextCode)) continue;
            }
            const eNext = schedule[nxt.ds][e.id];
            if (isWorkingVal(eNext)) {
              const eNextCode = labelToShiftCode(eNext);
              if (eNextCode && !shiftAllowedAfter(wCode, eNextCode)) {
                if (shiftAllowedAfter(curCode, eNextCode)) continue;
              }
            }
          }

          best = w;
          bestDist = newDistE;
          bestAllowed = allowedE;
        }

        if (best) {
          const tmp = schedule[day.ds][e.id];
          schedule[day.ds][e.id] = schedule[day.ds][best.id];
          schedule[day.ds][best.id] = tmp;
          improved = true;
        }
      }
    }
    return improved;
  };

  for (let pass = 0; pass < 80; pass++) {
    if (!tryImprove(true)) break;
  }
  for (let pass = 0; pass < 50; pass++) {
    if (!tryImprove(false)) break;
  }
}

/**
 * Twarda reguła końcowa:
 * - w jednej serii max 1 skok godziny,
 * - nigdy niedozwolone przejście (np. 13:00→8:30 / S5→S1).
 */
function enforceSeriesShiftRules(employees, openDays, schedule) {
  const activeDays = openDays.filter(d => !d.closed);

  for (const e of employees) {
    let seriesJumps = 0;
    let prevCode = null;
    let prevDay = null;

    for (let i = 0; i < activeDays.length; i++) {
      const day = activeDays[i];
      const val = schedule[day.ds]?.[e.id];
      if (!isWorkingVal(val)) {
        prevCode = null;
        prevDay = null;
        seriesJumps = 0;
        continue;
      }
      if (prevDay && calendarDayDiff(prevDay.ds, day.ds) !== 1) {
        prevCode = null;
        seriesJumps = 0;
      }

      let curCode = labelToShiftCode(val);
      if (!curCode) { prevDay = day; continue; }

      if (prevCode) {
        const same = curCode === prevCode;
        const allowed = shiftAllowedAfter(prevCode, curCode);
        const isJump = !same;
        const mustFix = (!allowed) || (isJump && seriesJumps >= MAX_JUMPS_PER_SERIES);

        if (mustFix && !isCellLocked(day.ds, e.id)) {
          const pref = getPref(day.ds, e.id);
          const prefBlocks = pref?.type === 'shift' && pref.code === curCode;

          if (!(prefBlocks && allowed && seriesJumps < MAX_JUMPS_PER_SERIES)) {
            const targetCodes = [prevCode];
            if (seriesJumps < MAX_JUMPS_PER_SERIES) {
              for (const c of SHIFT_ORDER) {
                if (c !== prevCode && shiftAllowedAfter(prevCode, c)) targetCodes.push(c);
              }
            }

            let swapped = false;
            for (const want of targetCodes) {
              const partners = employees.filter(w =>
                w.id !== e.id &&
                isWorkingVal(schedule[day.ds][w.id]) &&
                !isCellLocked(day.ds, w.id) &&
                labelToShiftCode(schedule[day.ds][w.id]) === want
              );
              for (const w of partners) {
                const wp = getPref(day.ds, w.id);
                if (wp?.type === 'shift' && wp.code === want) continue;
                const wPrevVal = schedule[prevDay.ds]?.[w.id];
                if (isWorkingVal(wPrevVal)) {
                  const wPrevCode = labelToShiftCode(wPrevVal);
                  if (wPrevCode && !shiftAllowedAfter(wPrevCode, curCode)) continue;
                }
                schedule[day.ds][e.id] = SHIFTS[want].label;
                schedule[day.ds][w.id] = SHIFTS[curCode].label;
                curCode = want;
                swapped = true;
                break;
              }
              if (swapped) break;
            }
            if (!swapped) {
              // Nie cofaj S1/S5 jeśli to jedyne otwarcie/zamknięcie dnia
              const isOnlyOpen = curCode === 'S1' && employees.filter(x =>
                schedule[day.ds]?.[x.id] === SHIFTS.S1.label).length <= 1;
              const isOnlyClose = curCode === 'S5' && employees.filter(x =>
                schedule[day.ds]?.[x.id] === SHIFTS.S5.label).length <= 1;
              if (!isOnlyOpen && !isOnlyClose) {
                schedule[day.ds][e.id] = SHIFTS[prevCode].label;
                curCode = prevCode;
              }
            }
          }
        } else if (mustFix && isCellLocked(day.ds, e.id) && isJump) {
          seriesJumps++;
          prevCode = curCode;
          prevDay = day;
          continue;
        }

        if (curCode !== prevCode) seriesJumps++;
      }

      prevCode = curCode;
      prevDay = day;
    }
  }
}

function fulfillShiftPreferences(employees, openDays, schedule) {
  for (const day of openDays) {
    if (day.closed) continue;
    const workers = employees.filter(e => isWorkingVal(schedule[day.ds][e.id]));
    if (!workers.length) continue;

    const countLabel = (label, skipId) => {
      let n = 0;
      for (const w of workers) {
        if (skipId && w.id === skipId) continue;
        if (schedule[day.ds][w.id] === label) n++;
      }
      return n;
    };

    for (const e of workers) {
      if (isCellLocked(day.ds, e.id)) continue;
      const p = getPref(day.ds, e.id);
      if (!p || p.type !== 'shift' || !SHIFTS[p.code]) continue;
      // Uczeń: preferencja S1/S5 tylko gdy ktoś już jest na tej zmianie
      if (isStudentEmp(e) && (p.code === 'S1' || p.code === 'S5') && countLabel(SHIFTS[p.code].label) < 1) continue;
      const expected = SHIFTS[p.code].label;
      if (schedule[day.ds][e.id] === expected) continue;

      // 1) Zamiana z kimś, kto ma expected, a nie preferuje tej zmiany
      let swapped = false;
      for (const w of workers) {
        if (w.id === e.id) continue;
        if (isCellLocked(day.ds, w.id)) continue;
        if (schedule[day.ds][w.id] !== expected) continue;
        const wp = getPref(day.ds, w.id);
        if (wp?.type === 'shift' && SHIFTS[wp.code]?.label === expected) continue;
        const myLabel = schedule[day.ds][e.id];
        const myCode = labelToShiftCode(myLabel);
        // Po zamianie uczeń w nie może zostać sam na S1/S5
        if (isStudentEmp(w) && (myCode === 'S1' || myCode === 'S5')) {
          const othersOnMy = workers.filter(x =>
            x.id !== w.id && x.id !== e.id && schedule[day.ds][x.id] === myLabel
          );
          if (othersOnMy.length === 0) continue;
        }
        schedule[day.ds][e.id] = expected;
        schedule[day.ds][w.id] = myLabel;
        swapped = true;
        break;
      }
      if (swapped) continue;

      // 2) Wolne miejsce na preferred (< 2) — ustaw bezpośrednio
      // Uczeń dołącza do S1/S5 tylko gdy już jest co najmniej 1 osoba
      if (countLabel(expected) < 2) {
        if (isStudentEmp(e) && (p.code === 'S1' || p.code === 'S5') && countLabel(expected) < 1) continue;
        schedule[day.ds][e.id] = expected;
      }
    }

    // Utrzymaj open + close — pierwszeństwo nie-uczniów (samodzielne otwarcie/zamknięcie)
    let hasOpen = false, hasClose = false;
    for (const w of workers) {
      const v = schedule[day.ds][w.id];
      if (v === SHIFTS.S1.label) hasOpen = true;
      if (v === SHIFTS.S5.label) hasClose = true;
    }
    if (!hasOpen || !hasClose) {
      for (const w of workers) {
        if (isStudentEmp(w)) continue;
        const wp = getPref(day.ds, w.id);
        if (wp?.type === 'shift') continue;
        if (!hasOpen) {
          schedule[day.ds][w.id] = SHIFTS.S1.label;
          hasOpen = true;
        } else if (!hasClose) {
          schedule[day.ds][w.id] = SHIFTS.S5.label;
          hasClose = true;
        }
        if (hasOpen && hasClose) break;
      }
    }
  }
}

function buildScheduleWarnings(openDays, schedule, employees, curMonth, actualUrlop, freeSaturdays) {
  const warnings = []; // czerwone (krytyczne)
  const soft = [];     // żółte (miękkie)

  for (const day of openDays) {
    if (day.closed) continue;

    // Obsada minimalna bez uczniów
    let workingCount = 0;
    let hasOpen = false;
    let hasClose = false;
    const targetMin = minStaffForDay(day);

    for (const e of employees) {
      const val = schedule[day.ds][e.id];
      if (!isWorkingVal(val)) continue;
      if (!isStudentEmp(e)) workingCount++;
      if (val === SHIFTS.S1.label) hasOpen = true;
      if (val === SHIFTS.S5.label) hasClose = true;
    }

    // Obsada < 3 (absolutne minimum) → czerwony; sobota 3 zamiast 4 → żółty
    if (workingCount < MIN_STAFF) {
      warnings.push(
        `Dzień ${day.d}.${curMonth}: Zbyt niska obsada salonu (${workingCount} os. bez uczniów). Absolutne minimum: ${MIN_STAFF}.`
      );
    } else if (day.dow === 6 && workingCount < MIN_STAFF_SATURDAY) {
      soft.push(
        `Dzień ${day.d}.${curMonth}: Niska obsada w sobotę (${workingCount} os. bez uczniów, docelowo ${MIN_STAFF_SATURDAY}).`
      );
    }
    // Brak otwarcia / zamknięcia → czerwony
    if (!hasOpen) {
      warnings.push(
        `Dzień ${day.d}.${curMonth}: Brak osoby otwierającej salon (zmiana ${SHIFTS.S1.label}).`
      );
    }
    if (!hasClose) {
      warnings.push(
        `Dzień ${day.d}.${curMonth}: Brak osoby zamykającej salon (zmiana ${SHIFTS.S5.label}).`
      );
    }
  }

  for (const e of employees) {
    const h = totalHours(e, openDays, schedule, actualUrlop);
    // Niedobór etatu → czerwony
    if (h < e.target) {
      warnings.push(
        `${e.name}: nie udało się osiągnąć etatu (${h}h z ${e.target}h).`
      );
    }
    // Nadgodziny → czerwony
    if (h > e.target) {
      const over = h - e.target;
      warnings.push(
        `${e.name}: nadgodziny (+${over}h, ${h}h z ${e.target}h).`
      );
    }
  }

  // Niespełnione preferencje zmian → żółty
  for (const day of openDays) {
    if (day.closed) continue;
    for (const e of employees) {
      const p = getPref(day.ds, e.id);
      if (!p || p.type !== 'shift') continue;
      const expected = SHIFTS[p.code]?.label;
      if (!expected) continue;
      const val = schedule[day.ds]?.[e.id];
      if (val !== expected) {
        soft.push(`${e.name}, ${day.d}.${curMonth}: preferencja ${expected}, jest ${val || '—'}.`);
      }
    }
  }

  return { hard: warnings, soft };
}

function generateSchedule() {
  const { employees, curYear, curMonth } = state;

  if (employees.length === 0) {
    renderWarnings(['Brak pracowników w systemie. Dodaj przynajmniej jedną osobę.'], []);
    return;
  }

  const openDays = buildOpenDays(curYear, curMonth);
  const activeDays = openDays.filter(d => !d.closed);
  const nd = openDays.length;

  const { quota, remaining, requiredOff } = computeQuotas(employees, activeDays, nd);

  const consec = {};
  const openCnt = {};
  const closeCnt = {};
  const midCnt = {};
  const lastShift = {};
  const satOffCnt = {};
  const shiftJumps = {};
  for (const e of employees) {
    consec[e.id] = 0;
    openCnt[e.id] = 0;
    closeCnt[e.id] = 0;
    midCnt[e.id] = 0;
    lastShift[e.id] = null;
    satOffCnt[e.id] = 0;
    shiftJumps[e.id] = 0;
  }

  // Idziemy po kolei kalendarzowej: zamknięty dzień (niedziela/święto)
  // zeruje serię dni pracy — wolna niedziela przerywa limit „z rzędu”.
  const schedule = {};
  let activeIndex = 0;
  for (const day of openDays) {
    if (day.closed) {
      for (const e of employees) {
        consec[e.id] = 0;
        lastShift[e.id] = null;
        shiftJumps[e.id] = 0; // przerwa w serii (niedziela/święto)
      }
      schedule[day.ds] = {};
      for (const e of employees) schedule[day.ds][e.id] = 'Wolne';
      continue;
    }
    schedule[day.ds] = assignDayShifts(
      day, activeIndex, activeDays, employees,
      remaining, consec, openCnt, closeCnt, midCnt, lastShift, satOffCnt, shiftJumps
    );
    activeIndex++;
  }

  // Przywróć zablokowane komórki z poprzedniego grafiku (przed rebalance)
  applyLockedCellsToSchedule(schedule, openDays, employees);

  rebalanceStaffing(employees, openDays, schedule);
  ensureHourQuotas(employees, openDays, schedule, quota);
  trimOvertime(employees, openDays, schedule, quota);
  equalizeFreeSaturdays(employees, openDays, schedule);
  // Po wyrównaniu sobót — ponownie dociągnij minimum obsady
  rebalanceStaffing(employees, openDays, schedule);
  fillHoursDeficit(employees, openDays, activeDays, schedule, quota);
  // Po kompensatach sobót / urlopu — ponownie zetnij nadgodziny
  trimOvertime(employees, openDays, schedule, quota);
  fulfillShiftPreferences(employees, openDays, schedule);
  // Open/close fairness, then ±1 / S5→min S3 transitions
  equalizeOpenCloseRoles(employees, openDays, schedule);
  smoothShiftTransitions(employees, openDays, schedule);
  equalizeOpenCloseRoles(employees, openDays, schedule);
  smoothShiftTransitions(employees, openDays, schedule);
  // Uczeń: otwarcie/zamknięcie tylko z partnerem na tej samej zmianie
  enforceStudentNoOpenClose(employees, openDays, schedule);
  // Finalne przycięcie nadgodzin (post-passy mogły coś dopisać)
  trimOvertime(employees, openDays, schedule, quota);
  // Twarde: każdy dzień MUSI mieć otwarcie i zamknięcie (po wszystkich passach)
  ensureOpenAndClose(employees, openDays, schedule);
  // Uczeń mógł dostać solo S1/S5 przy uzupełnianiu — popraw
  enforceStudentNoOpenClose(employees, openDays, schedule);
  ensureOpenAndClose(employees, openDays, schedule);

  // Ponownie wymuś zablokowane wartości (post-pass nie może ich nadpisać)
  applyLockedCellsToSchedule(schedule, openDays, employees);
  // Po przywróceniu locków jeszcze raz domknij open/close (lock mógł zabrać S5)
  ensureOpenAndClose(employees, openDays, schedule);

  // Ciągłość serii (max 1 skok, zakaz S5→S1)
  enforceSeriesShiftRules(employees, openDays, schedule);
  equalizeOpenCloseRoles(employees, openDays, schedule);
  enforceSeriesShiftRules(employees, openDays, schedule);
  equalizeOpenCloseRoles(employees, openDays, schedule);
  enforceStudentNoOpenClose(employees, openDays, schedule);
  applyLockedCellsToSchedule(schedule, openDays, employees);

  // OSTATECZNE: każdy dzień MUSI mieć otwarcie i zamknięcie
  // (ważniejsze niż ciągłość godzin — salon nie może zostać bez zamknięcia)
  ensureOpenAndClose(employees, openDays, schedule);
  enforceStudentNoOpenClose(employees, openDays, schedule);
  ensureOpenAndClose(employees, openDays, schedule);

  const roleCounts = computeRoleCounts(employees, openDays, schedule);
  const freeSaturdays = computeFreeSaturdays(employees, openDays, schedule);

  const actualWolne = {};
  const actualUrlop = {};
  for (const e of employees) {
    actualWolne[e.id] = openDays.filter(d => schedule[d.ds]?.[e.id] === 'Wolne').length;
    actualUrlop[e.id] = openDays.filter(d => schedule[d.ds]?.[e.id] === 'Urlop').length;
  }

  const { hard: hardWarnings, soft: softWarnings } = buildScheduleWarnings(
    openDays, schedule, employees, curMonth, actualUrlop, freeSaturdays
  );

  // Zapisz poprzedni grafik w historii (Cofnij wraca do stanu sprzed GENERUJ)
  if (state.lastSchedule?.schedule) {
    pushScheduleHistory();
  }

  state.lastSchedule = {
    openDays, schedule, quota, remaining, requiredOff,
    actualWolne, actualUrlop, warnings: hardWarnings, softWarnings,
    roleCounts, freeSaturdays,
  };

  renderWarnings(hardWarnings, softWarnings);
  renderOutput(openDays, schedule, requiredOff, actualWolne, actualUrlop, roleCounts, freeSaturdays);
  saveCurrentSchedule();
}

function renderWarnings(hardWarnings, softWarnings) {
  const box = document.getElementById('warnings');
  const hard = hardWarnings || [];
  const soft = softWarnings || [];
  if (!hard.length && !soft.length) {
    box.innerHTML = '';
    return;
  }
  let html = '';
  if (hard.length) {
    const items = hard.map(w => `<div class="warn-item">${esc(w)}</div>`).join('');
    html += `<div class="warn-badge" tabindex="0">
      ⚠<span class="warn-count">${hard.length}</span>
      <div class="warn-tooltip" role="tooltip">${items}</div></div>`;
  }
  if (soft.length) {
    const items = soft.map(w => `<div class="warn-item warn-soft-item">${esc(w)}</div>`).join('');
    html += `<div class="warn-badge warn-soft" tabindex="0">
      ⚡<span class="warn-count">${soft.length}</span>
      <div class="warn-tooltip" role="tooltip">${items}</div></div>`;
  }
  box.innerHTML = html;
}

  val === 'Wolne' ? 'off' : val === 'Urlop' ? 'urlop' : `work ${weekendCls}`;

  const midRow = employees.map(e => `<td>${roleCounts[e.id]?.mid || 0}</td>`).join('');
